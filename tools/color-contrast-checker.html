<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Contrast Checker — Tools</title>
  <!-- Hide the back-bar when running inside the portfolio iframe -->
  <script>if (window.self !== window.top) document.documentElement.dataset.embed = '1';</script>
  <style>[data-embed='1'] header { display: none !important; }</style>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Fonts ── */
    @font-face {
      font-family: 'BoldPixels';
      src: url('../assets/BoldPixels.otf') format('opentype');
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .title-font {
      font-family: 'BoldPixels', 'Courier New', monospace;
      letter-spacing: 2px;
    }
    .mono { font-family: 'Fira Code', monospace; }

    /* ── Color panels ── */
    .color-panel {
      transition: background-color 0.25s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 24px;
      flex: 1;
      min-height: 260px;
      overflow: hidden;
    }
    .panel-label {
      position: absolute;
      top: 20px; left: 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 600;
      opacity: 0.55;
      transition: color 0.25s;
    }

    /* ── Hex Input ── */
    .hex-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hex-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,0,0,0.18);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 6px 12px;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, background 0.25s;
    }
    .hex-box:focus-within { border-color: rgba(255,255,255,0.5); }
    .hex-symbol {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      font-weight: 600;
      opacity: 0.6;
    }
    .hex-input {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      width: 72px;
      background: transparent;
      border: none;
      outline: none;
      color: inherit;
      letter-spacing: 1px;
    }
    .hex-input::selection { background: rgba(255,255,255,0.25); }

    /* ── Color picker ── */
    .picker-wrapper {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s;
      flex-shrink: 0;
    }
    .picker-wrapper:hover { border-color: rgba(255,255,255,0.55); }
    .picker-swatch {
      position: absolute; inset: 0;
      pointer-events: none;
      transition: background-color 0.25s;
    }
    input[type="color"] {
      position: absolute;
      top: -4px; left: -4px;
      width: 40px; height: 40px;
      opacity: 0;
      cursor: pointer;
    }

    /* ── Icon button ── */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
      background: rgba(255,255,255,0.06);
      color: inherit;
      opacity: 0.7;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.14); opacity: 1; border-color: rgba(255,255,255,0.3); }

    /* ── Copy toast ── */
    .copy-toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Fira Code', monospace;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Ratio display ── */
    .ratio-number {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      transition: color 0.3s;
      font-variant-numeric: tabular-nums;
    }
    .ratio-good  { color: #22c55e; }
    .ratio-ok    { color: #f59e0b; }
    .ratio-bad   { color: #ef4444; }

    /* ── WCAG Badges ── */
    .wcag-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 20px;
      border-radius: 14px;
      min-width: 110px;
      border: 1.5px solid transparent;
      transition: background 0.25s, border-color 0.25s;
    }
    .wcag-card.pass {
      background: rgba(34,197,94,0.1);
      border-color: rgba(34,197,94,0.25);
    }
    .wcag-card.fail {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.2);
    }
    .wcag-icon {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .wcag-card.pass .wcag-icon { color: #22c55e; }
    .wcag-card.fail .wcag-icon { color: #ef4444; }
    .wcag-label { font-size: 11px; font-weight: 600; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.08em; }
    .wcag-threshold { font-size: 10px; color: #52525b; font-family: 'Fira Code', monospace; }

    /* ── Preview tabs ── */
    .tab-btn {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: #52525b;
      background: none;
      border-top: none; border-left: none; border-right: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: #a1a1aa; }
    .tab-btn.active { color: #ef4444; border-bottom-color: #ef4444; }

    /* ── Preview area ── */
    .preview-area {
      transition: background-color 0.25s ease, color 0.25s ease;
      flex: 1;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

    /* ── Header action buttons ── */
    .hdr-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px;
      font-family: 'BoldPixels', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      border: 1.5px solid #3f3f46;
      border-radius: 6px;
      background: transparent;
      color: #71717a;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .hdr-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* ── Divider ── */
    .panel-divider {
      width: 1px;
      background: rgba(0,0,0,0.2);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .color-panel { min-height: 180px; padding: 14px 16px; }
      .panel-label { top: 14px; left: 16px; }
      .preview-area { padding: 24px 16px; }
      .wcag-card { padding: 10px 14px; min-width: 90px; }
      .ratio-number { letter-spacing: -1px; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════
     SCRIPT
════════════════════════════════════════════════════ -->
<script>
'use strict';

// ── State ──────────────────────────────────────────────────────
let bgHex   = '112a46';
let textHex = 'acc8e5';
let previewMode = 'heading';

// ── DOM ────────────────────────────────────────────────────────
const bgPanel      = document.getElementById('bgPanel');
const textPanel    = document.getElementById('textPanel');
const bgHexInput   = document.getElementById('bgHexInput');
const textHexInput = document.getElementById('textHexInput');
const bgPicker     = document.getElementById('bgPicker');
const textPicker   = document.getElementById('textPicker');
const bgPickerSwatch   = document.getElementById('bgPickerSwatch');
const textPickerSwatch = document.getElementById('textPickerSwatch');
const bgRgbLabel   = document.getElementById('bgRgbLabel');
const textRgbLabel = document.getElementById('textRgbLabel');
const bgLabel      = document.getElementById('bgLabel');
const textLabel    = document.getElementById('textLabel');
const bgHashSymbol = document.getElementById('bgHashSymbol');
const textHashSymbol = document.getElementById('textHashSymbol');
const bgHexBox     = document.getElementById('bgHexBox');
const textHexBox   = document.getElementById('textHexBox');
const bgCopyBtn    = document.getElementById('bgCopyBtn');
const textCopyBtn  = document.getElementById('textCopyBtn');
const ratioDisplay = document.getElementById('ratioDisplay');
const previewArea  = document.getElementById('previewArea');
const copyToast    = document.getElementById('copyToast');

// WCAG elements
const aaSmallCard   = document.getElementById('aaSmallCard');
const aaLargeCard   = document.getElementById('aaLargeCard');
const aaaCard       = document.getElementById('aaaCard');
const aaaLargeCard  = document.getElementById('aaaLargeCard');
const aaSmallIcon   = document.getElementById('aaSmallIcon');
const aaLargeIcon   = document.getElementById('aaLargeIcon');
const aaaIcon       = document.getElementById('aaaIcon');
const aaaLargeIcon  = document.getElementById('aaaLargeIcon');


// ── Color Math ─────────────────────────────────────────────────
function isValidHex(h) {
  return /^[0-9A-Fa-f]{6}$/.test(h);
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(0, 2), 16),
    g: parseInt(hex.slice(2, 4), 16),
    b: parseInt(hex.slice(4, 6), 16),
  };
}

function rgbToHex(r, g, b) {
  return [r, g, b]
    .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
    .join('');
}

/**
 * Convert sRGB channel (0-255) to linear light.
 * Uses IEC 61966-2-1 formula.
 */
function toLinear(c) {
  c /= 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

/** Relative luminance (WCAG 2.x definition). Returns 0–1. */
function getLuminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
}

/** WCAG contrast ratio between two hex colors. */
function contrastRatio(hex1, hex2) {
  const L1 = getLuminance(hex1);
  const L2 = getLuminance(hex2);
  const lighter = Math.max(L1, L2);
  const darker  = Math.min(L1, L2);
  return (lighter + 0.05) / (darker + 0.05);
}

/**
 * Return '#000000' or '#ffffff' — whichever is more readable
 * against the given background hex.
 */
function readableOn(hex) {
  return getLuminance(hex) > 0.179 ? '000000' : 'ffffff';
}

function randomHex() {
  return Math.floor(Math.random() * 0xFFFFFF)
    .toString(16).padStart(6, '0').toUpperCase();
}


// ── Apply Colors ───────────────────────────────────────────────
/**
 * Central update: apply bgHex & textHex to every part of the UI.
 */
function applyColors() {
  // ── Panel backgrounds ──
  bgPanel.style.backgroundColor   = '#' + bgHex;
  textPanel.style.backgroundColor = '#' + textHex;

  // Swatch circles in pickers
  bgPickerSwatch.style.backgroundColor   = '#' + bgHex;
  textPickerSwatch.style.backgroundColor = '#' + textHex;

  // ── Adapt control colors to each panel's bg ──
  adaptPanelUI('bg',   bgHex);
  adaptPanelUI('text', textHex);

  // ── Sync inputs ──
  bgHexInput.value   = bgHex.toUpperCase();
  textHexInput.value = textHex.toUpperCase();

  // ── Sync native pickers ──
  bgPicker.value   = '#' + bgHex;
  textPicker.value = '#' + textHex;

  // ── RGB labels ──
  const bgRgb   = hexToRgb(bgHex);
  const txtRgb  = hexToRgb(textHex);
  bgRgbLabel.textContent   = `rgb(${bgRgb.r}, ${bgRgb.g}, ${bgRgb.b})`;
  textRgbLabel.textContent = `rgb(${txtRgb.r}, ${txtRgb.g}, ${txtRgb.b})`;

  // ── Contrast ratio & WCAG ──
  updateResults();

  // ── Preview ──
  renderPreview();
}

/**
 * Adapt the controls inside a panel (labels, inputs, buttons)
 * so they're always readable against the panel's background.
 */
function adaptPanelUI(side, hex) {
  const onColor = readableOn(hex); // '000000' or 'ffffff'
  const isLight = onColor === '000000';
  const textCss = '#' + onColor;
  const subOpacity = isLight ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.45)';
  const borderCs  = isLight ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.18)';
  const boxBg     = isLight ? 'rgba(0,0,0,0.1)'  : 'rgba(255,255,255,0.1)';
  const pickerBorder = isLight ? 'rgba(0,0,0,0.28)' : 'rgba(255,255,255,0.28)';

  // Label
  const lbl = document.getElementById(side === 'bg' ? 'bgLabel' : 'textLabel');
  lbl.style.color = textCss;

  // Hash symbol
  const hash = document.getElementById(side === 'bg' ? 'bgHashSymbol' : 'textHashSymbol');
  hash.style.color = textCss;

  // Hex input
  const input = document.getElementById(side === 'bg' ? 'bgHexInput' : 'textHexInput');
  input.style.color = textCss;

  // Hex box border & bg
  const box = document.getElementById(side === 'bg' ? 'bgHexBox' : 'textHexBox');
  box.style.borderColor = borderCs;
  box.style.background  = boxBg;

  // Picker border
  const pickerWrap = document.getElementById(side === 'bg' ? 'bgPickerWrap' : 'textPickerWrap');
  pickerWrap.style.borderColor = pickerBorder;

  // Copy button
  const copyBtn = document.getElementById(side === 'bg' ? 'bgCopyBtn' : 'textCopyBtn');
  copyBtn.style.color = textCss;
  copyBtn.style.borderColor = borderCs;
  copyBtn.style.background  = boxBg;

  // RGB label
  const rgbLbl = document.getElementById(side === 'bg' ? 'bgRgbLabel' : 'textRgbLabel');
  rgbLbl.style.color = textCss;
}


// ── Results ────────────────────────────────────────────────────
function updateResults() {
  const ratio = contrastRatio(bgHex, textHex);

  // Ratio display
  ratioDisplay.textContent = ratio.toFixed(2) + ':1';
  ratioDisplay.className = 'ratio-number ' +
    (ratio >= 7  ? 'ratio-good' :
     ratio >= 4.5 ? 'ratio-ok'  : 'ratio-bad');

  // WCAG checks
  setBadge(aaSmallCard,  aaSmallIcon,  ratio >= 4.5);
  setBadge(aaLargeCard,  aaLargeIcon,  ratio >= 3.0);
  setBadge(aaaCard,      aaaIcon,       ratio >= 7.0);
  setBadge(aaaLargeCard, aaaLargeIcon,  ratio >= 4.5);
}

function setBadge(card, iconEl, pass) {
  card.className  = 'wcag-card ' + (pass ? 'pass' : 'fail');
  iconEl.textContent = pass ? '✔' : '✖';
}


// ── Preview ────────────────────────────────────────────────────
const PREVIEW_TEMPLATES = {

  heading: (bg, text) => `
    <div style="max-width:540px; width:100%; text-align:left;">
      <p style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin-bottom:10px;font-weight:600;">Preview</p>
      <h1 style="font-size:clamp(2rem,5vw,3.2rem);font-weight:800;line-height:1.1;margin-bottom:16px;letter-spacing:-1px;">
        The quick brown fox jumps
      </h1>
      <h2 style="font-size:clamp(1.1rem,3vw,1.6rem);font-weight:600;line-height:1.3;opacity:.75;">
        Good design is obvious. Great design is transparent.
      </h2>
    </div>`,

  body: (bg, text) => `
    <div style="max-width:540px; width:100%; text-align:left;">
      <p style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin-bottom:10px;font-weight:600;">Preview</p>
      <p style="font-size:1rem;line-height:1.75;margin-bottom:14px;opacity:.9;">
        Typography is the craft of enduring visual communication and the
        foundation of readable, accessible design. Every choice in font,
        weight, and spacing shapes how well users can consume your content.
      </p>
      <p style="font-size:.875rem;line-height:1.7;opacity:.65;">
        WCAG 2.1 defines minimum contrast ratios to ensure text is
        readable by people with low vision or colour blindness. AA requires
        4.5:1 for normal text and 3:1 for large text (18pt+ or 14pt+ bold).
      </p>
    </div>`,

  ui: (bg, text) => `

function renderPreview() {
  const template = PREVIEW_TEMPLATES[previewMode] || PREVIEW_TEMPLATES.heading;
  previewArea.style.backgroundColor = '#' + bgHex;
  previewArea.style.color           = '#' + textHex;
  previewArea.innerHTML = template(bgHex, textHex);
}


// ── Hex Input Handling ─────────────────────────────────────────
function sanitizeHexInput(raw) {
  // Strip leading # if pasted
  let hex = raw.replace(/^#/, '').toUpperCase();
  // Expand 3-char shorthand
  if (/^[0-9A-F]{3}$/.test(hex)) {
    hex = hex.split('').map(c => c + c).join('');
  }
  return hex;
}

bgHexInput.addEventListener('input', () => {
  const hex = sanitizeHexInput(bgHexInput.value);
  if (isValidHex(hex)) {
    bgHex = hex.toLowerCase();
    applyColors();
  }
});

bgHexInput.addEventListener('blur', () => {
  // Revert if invalid on blur
  if (!isValidHex(sanitizeHexInput(bgHexInput.value))) {
    bgHexInput.value = bgHex.toUpperCase();
  }
});

textHexInput.addEventListener('input', () => {
  const hex = sanitizeHexInput(textHexInput.value);
  if (isValidHex(hex)) {
    textHex = hex.toLowerCase();
    applyColors();
  }
});

textHexInput.addEventListener('blur', () => {
  if (!isValidHex(sanitizeHexInput(textHexInput.value))) {
    textHexInput.value = textHex.toUpperCase();
  }
});

// ── Native Color Picker Sync ───────────────────────────────────
bgPicker.addEventListener('input', () => {
  bgHex = bgPicker.value.slice(1).toLowerCase();
  applyColors();
});

textPicker.addEventListener('input', () => {
  textHex = textPicker.value.slice(1).toLowerCase();
  applyColors();
});

// ── Swap ────────────────────────────────────────────────────────
document.getElementById('swapBtn').addEventListener('click', () => {
  [bgHex, textHex] = [textHex, bgHex];
  applyColors();
});

// ── Random ──────────────────────────────────────────────────────
document.getElementById('randomBtn').addEventListener('click', () => {
  bgHex   = randomHex().toLowerCase();
  textHex = randomHex().toLowerCase();
  applyColors();
});

// ── Copy HEX ────────────────────────────────────────────────────
let toastTimer = null;

function copyHex(side) {
  const hex = '#' + (side === 'bg' ? bgHex : textHex).toUpperCase();
  navigator.clipboard.writeText(hex).then(() => showToast('Copied ' + hex)).catch(() => {
    // Fallback for non-HTTPS or older browsers
    const ta = document.createElement('textarea');
    ta.value = hex;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied ' + hex);
  });
}

function showToast(msg) {
  copyToast.textContent = msg;
  copyToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => copyToast.classList.remove('show'), 2000);
}

// ── Preview Tabs ────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    previewMode = btn.dataset.mode;
    renderPreview();
  });
});

// ── Init ────────────────────────────────────────────────────────
applyColors();
</script>
