<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to SVG — Tools</title>
  <script>if (window.self !== window.top) document.documentElement.dataset.embed = '1';</script>
  <style>[data-embed='1'] header { display: none !important; }</style>
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'BoldPixels';
      src: url('../assets/BoldPixels.otf') format('opentype');
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { font-family: 'Fira Code', monospace; }
    .title-font { font-family: 'BoldPixels', 'Courier New', monospace; letter-spacing: 2px; }

    html, body { height: 100%; }
    body {
      background-color: #09090b;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* ── Header ── */
    .hdr-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px;
      font-family: 'BoldPixels', monospace;
      font-size: 10px; letter-spacing: 1px;
      border: 1.5px solid #3f3f46; border-radius: 6px;
      background: transparent; color: #71717a;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .hdr-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* ── Main layout ── */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 60px;
      gap: 20px;
    }

    /* ── Drop state ── */
    #dropState { width: 100%; max-width: 680px; }

    .drop-card {
      background: #111113;
      border: 1px solid #1c1c1e;
      border-radius: 14px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .drop-zone {
      width: 100%;
      border: 2px dashed #27272a; border-radius: 12px;
      padding: 64px 40px;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.04);
    }
    .drop-label {
      font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; color: #52525b;
      font-family: 'BoldPixels', monospace;
    }
    .drop-sub { font-size: 11px; color: #3f3f46; }
    .choose-btn {
      margin-top: 4px;
      padding: 7px 22px;
      border: 1.5px solid #3f3f46; border-radius: 8px;
      font-size: 11px; font-family: 'BoldPixels', monospace;
      letter-spacing: 1px; color: #71717a; background: transparent;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .choose-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* ── Image state ── */
    #imageState {
      display: none;
      width: 100%; max-width: 860px;
      flex-direction: column; gap: 20px;
    }
    #imageState.show { display: flex; }

    /* ── Tool card ── */
    .tool-card {
      width: 100%;
      background: #111113;
      border: 1px solid #1c1c1e;
      border-radius: 14px;
      overflow: hidden;
    }
    .card-header {
      padding: 12px 20px;
      border-bottom: 1px solid #1c1c1e;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .card-label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.14em; color: #52525b; font-weight: 600;
    }

    /* ── Panels ── */
    .panels-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .img-panel { display: flex; flex-direction: column; }
    .img-panel:first-child { border-right: 1px solid #1c1c1e; }

    .panel-header {
      padding: 8px 16px;
      border-bottom: 1px solid #1c1c1e;
      display: flex; align-items: center; justify-content: space-between;
    }

    .img-panel-body {
      height: 360px;
      display: flex; align-items: center; justify-content: center;
      background: #0c0c0e;
      overflow: hidden;
      position: relative;
    }

    /* Checkerboard for SVG panel */
    .checker {
      background-image:
        linear-gradient(45deg, #161618 25%, transparent 25%),
        linear-gradient(-45deg, #161618 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #161618 75%),
        linear-gradient(-45deg, transparent 75%, #161618 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-color: #0c0c0e;
    }

    canvas#originalCanvas { max-width: 90%; max-height: 90%; display: block; }

    #svgResult {
      width: 90%; height: 90%;
      display: flex; align-items: center; justify-content: center;
    }
    #svgResult svg {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto; display: block;
    }

    /* Processing overlay */
    .processing-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(9, 9, 11, 0.85);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      z-index: 10;
    }
    .processing-overlay.show { display: flex; }
    .processing-text {
      font-size: 10px; color: #ef4444;
      letter-spacing: 2px; text-transform: uppercase;
    }

    /* Spinner */
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #27272a;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Controls ── */
    .controls-body {
      padding: 20px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px 28px;
      align-items: start;
    }
    .ctrl-group { display: flex; flex-direction: column; gap: 8px; }
    .ctrl-label-row { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-label {
      font-size: 10px; color: #52525b;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .ctrl-value { font-size: 10px; color: #ef4444; font-variant-numeric: tabular-nums; }

    /* Range sliders */
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 3px;
      border-radius: 2px; background: #27272a; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 13px; height: 13px;
      border-radius: 50%; background: #ef4444; cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px; height: 13px;
      border-radius: 50%; background: #ef4444; border: none; cursor: pointer;
    }

    /* Preset buttons */
    .preset-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .preset-btn {
      padding: 4px 12px; font-size: 10px;
      font-family: 'BoldPixels', monospace; letter-spacing: 1px;
      border: 1.5px solid #3f3f46; border-radius: 6px;
      background: transparent; color: #71717a;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .preset-btn:hover, .preset-btn.active { border-color: #ef4444; color: #ef4444; }

    /* Download buttons */
    .dl-btn {
      padding: 5px 14px; font-size: 10px;
      font-family: 'BoldPixels', monospace; letter-spacing: 1px;
      border-radius: 6px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .dl-outline { border: 1.5px solid #3f3f46; background: transparent; color: #71717a; }
    .dl-outline:hover { border-color: #ef4444; color: #ef4444; }
    .dl-solid { border: 1.5px solid #ef4444; background: #ef4444; color: #fff; }
    .dl-solid:hover { background: #dc2626; border-color: #dc2626; }

    /* Reset */
    .reset-btn {
      width: 100%; padding: 8px;
      border: 1.5px solid #27272a; border-radius: 8px;
      background: transparent; color: #52525b;
      font-size: 10px; font-family: 'BoldPixels', monospace;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
      margin-top: 4px;
    }
    .reset-btn:hover { border-color: #52525b; color: #a1a1aa; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

    @media (max-width: 600px) {
      .panels-row { grid-template-columns: 1fr; }
      .img-panel:first-child { border-right: none; border-bottom: 1px solid #1c1c1e; }
      .controls-body { grid-template-columns: 1fr 1fr; }
      .main-content { padding: 20px 16px 40px; }
    }
  </style>
</head>
<body>

<!-- ════ HEADER ════ -->
<header style="background:#09090b; border-bottom:1px solid #1c1c1e; display:flex; align-items:center; gap:16px; padding:12px 20px; flex-shrink:0;">
  <a href="../index.html" class="title-font" style="font-size:10px; color:#52525b; text-decoration:none;"
     onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#52525b'">← Back</a>
  <div style="width:1px;height:16px;background:#27272a;"></div>
  <h1 class="title-font" style="font-size:10px; color:#e4e4e7;">Image to SVG</h1>

  <div id="headerActions" style="display:none; margin-left:auto; align-items:center; gap:8px;">
    <button id="copySvgBtn" class="hdr-btn">⎘ Copy SVG</button>
    <button id="downloadSvgBtn" class="dl-btn dl-solid" style="font-family:'BoldPixels',monospace; font-size:10px;">↓ Download SVG</button>
    <button id="changeImgBtn" class="hdr-btn">⤴ Change Image</button>
  </div>
</header>


<!-- ════ MAIN ════ -->
<div class="main-content">

  <!-- ── DROP STATE ── -->
  <div id="dropState">
    <div>
      <p class="title-font" style="font-size:11px; color:#e4e4e7; text-align:center; margin-bottom:4px;">Image to SVG</p>
      <p style="font-size:11px; color:#52525b; text-align:center; margin-bottom:20px;">Trace raster images into vector SVG — like Illustrator's Image Trace</p>
    </div>
    <div class="drop-card">
      <div id="dropZone" class="drop-zone">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p class="drop-label">Drop image here</p>
        <p class="drop-sub">JPG · PNG · WebP</p>
        <label class="choose-btn">
          Choose File
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none;" />
        </label>
      </div>
    </div>
  </div>


  <!-- ── IMAGE STATE ── -->
  <div id="imageState">

    <!-- Panels card -->
    <div class="tool-card">
      <div class="panels-row">

        <!-- Original -->
        <div class="img-panel">
          <div class="panel-header">
            <span class="card-label">Original</span>
          </div>
          <div class="img-panel-body">
            <canvas id="originalCanvas"></canvas>
          </div>
        </div>

        <!-- SVG Result -->
        <div class="img-panel">
          <div class="panel-header">
            <span class="card-label">SVG Result</span>
            <div style="display:flex; gap:6px;">
              <button id="copySvgBtnPanel" class="dl-btn dl-outline">⎘ Copy</button>
              <button id="downloadSvgBtnPanel" class="dl-btn dl-solid">↓ SVG</button>
            </div>
          </div>
          <div class="img-panel-body checker">
            <div id="svgResult"></div>
            <div class="processing-overlay" id="processingOverlay">
              <div class="spinner"></div>
              <span class="processing-text">Tracing…</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Controls card -->
    <div class="tool-card">
      <div class="card-header">
        <span class="card-label">Trace Settings</span>
        <div class="preset-row">
          <span style="font-size:10px; color:#3f3f46; letter-spacing:.08em; margin-right:4px;">Presets:</span>
          <button class="preset-btn active" data-preset="balanced">Balanced</button>
          <button class="preset-btn" data-preset="detailed">Detailed</button>
          <button class="preset-btn" data-preset="flat">Flat</button>
          <button class="preset-btn" data-preset="bw">B&W</button>
        </div>
      </div>
      <div class="controls-body">

        <!-- Colors -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Colors</span>
            <span class="ctrl-value" id="colorsVal">16</span>
          </div>
          <input type="range" id="colorsSlider" min="2" max="32" value="16" />
        </div>

        <!-- Detail -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Detail</span>
            <span class="ctrl-value" id="detailVal">5</span>
          </div>
          <input type="range" id="detailSlider" min="1" max="10" value="5" />
        </div>

        <!-- Blur -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Blur (Denoise)</span>
            <span class="ctrl-value" id="blurVal">0</span>
          </div>
          <input type="range" id="blurSlider" min="0" max="5" value="0" />
        </div>

        <!-- Stroke Width -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Stroke Width</span>
            <span class="ctrl-value" id="strokeVal">0</span>
          </div>
          <input type="range" id="strokeSlider" min="0" max="5" value="0" />
        </div>

        <!-- Reset -->
        <div class="ctrl-group" style="justify-content:flex-end;">
          <button class="reset-btn" id="resetBtn">Reset Settings</button>
        </div>

      </div>
    </div>

  </div><!-- /imageState -->

</div><!-- /main-content -->


<!-- ════ SCRIPT ════ -->
<script>
'use strict';

// ── Presets ────────────────────────────────────────────────────
const PRESETS = {
  balanced: { colors: 16, detail: 5,  blur: 0, stroke: 0 },
  detailed: { colors: 24, detail: 9,  blur: 0, stroke: 0 },
  flat:     { colors: 8,  detail: 3,  blur: 2, stroke: 1 },
  bw:       { colors: 2,  detail: 6,  blur: 1, stroke: 0 },
};
const DEFAULTS = PRESETS.balanced;

// ── State ──────────────────────────────────────────────────────
let sourceImg   = null;
let svgString   = '';
let tracePending = false;
let traceTimer   = null;

// ── DOM refs ───────────────────────────────────────────────────
const dropState        = document.getElementById('dropState');
const imageState       = document.getElementById('imageState');
const dropZone         = document.getElementById('dropZone');
const fileInput        = document.getElementById('fileInput');
const originalCanvas   = document.getElementById('originalCanvas');
const svgResult        = document.getElementById('svgResult');
const processingOverlay = document.getElementById('processingOverlay');
const headerActions    = document.getElementById('headerActions');

const sliders = {
  colors: document.getElementById('colorsSlider'),
  detail: document.getElementById('detailSlider'),
  blur:   document.getElementById('blurSlider'),
  stroke: document.getElementById('strokeSlider'),
};
const labels = {
  colors: document.getElementById('colorsVal'),
  detail: document.getElementById('detailVal'),
  blur:   document.getElementById('blurVal'),
  stroke: document.getElementById('strokeVal'),
};

const MAX_PX = 800;


// ── State transitions ──────────────────────────────────────────
function showImageState() {
  dropState.style.display = 'none';
  imageState.classList.add('show');
  headerActions.style.display = 'flex';
}
function showDropState() {
  imageState.classList.remove('show');
  dropState.style.display = '';
  headerActions.style.display = 'none';
  sourceImg  = null;
  svgString  = '';
  svgResult.innerHTML = '';
}


// ── File loading ───────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth  * scale);
      const h = Math.round(img.naturalHeight * scale);

      originalCanvas.width  = w;
      originalCanvas.height = h;
      originalCanvas.getContext('2d').drawImage(img, 0, 0, w, h);

      sourceImg = img;
      showImageState();
      scheduleTrace();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}


// ── Tracing ────────────────────────────────────────────────────
function getOptions() {
  const detail = +sliders.detail.value;
  const ltres  = Math.max(0.1, 11 - detail); // higher detail → lower threshold
  const qtres  = Math.max(0.1, 11 - detail);
  return {
    numberofcolors: +sliders.colors.value,
    colorsampling:  1,
    colorquantcycles: 3,
    ltres,
    qtres,
    pathomit:    4,
    blurradius:  +sliders.blur.value,
    blurdelta:   20,
    strokewidth: +sliders.stroke.value,
    scale:       1,
    roundcoords: 1,
  };
}

function scheduleTrace(delay = 800) {
  clearTimeout(traceTimer);
  traceTimer = setTimeout(runTrace, delay);
}

function runTrace() {
  if (!sourceImg) return;
  processingOverlay.classList.add('show');

  setTimeout(() => {
    // Draw source image at trace resolution
    const offscreen = document.createElement('canvas');
    offscreen.width  = originalCanvas.width;
    offscreen.height = originalCanvas.height;
    offscreen.getContext('2d').drawImage(sourceImg, 0, 0, offscreen.width, offscreen.height);

    const imgData = offscreen.getContext('2d').getImageData(0, 0, offscreen.width, offscreen.height);
    const opts    = getOptions();

    try {
      svgString = ImageTracer.imagedataToSVG(imgData, opts);
      svgResult.innerHTML = svgString;

      // Remove hardcoded dimensions so CSS controls sizing
      const svg = svgResult.querySelector('svg');
      if (svg) {
        const w = svg.getAttribute('width');
        const h = svg.getAttribute('height');
        if (w && h && !svg.getAttribute('viewBox')) {
          svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        }
        svg.removeAttribute('width');
        svg.removeAttribute('height');
      }
    } catch (err) {
      svgResult.innerHTML = `<span style="font-size:10px;color:#ef4444;">Trace failed: ${err.message}</span>`;
    }

    processingOverlay.classList.remove('show');
  }, 30);
}


// ── Drag & drop ────────────────────────────────────────────────
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});
dropZone.addEventListener('click', e => {
  if (e.target.closest('label')) return;
  fileInput.click();
});
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));


// ── Sliders ────────────────────────────────────────────────────
Object.entries(sliders).forEach(([key, el]) => {
  el.addEventListener('input', () => {
    labels[key].textContent = el.value;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    scheduleTrace();
  });
});


// ── Presets ────────────────────────────────────────────────────
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyPreset(btn.dataset.preset);
  });
});

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  sliders.colors.value = p.colors; labels.colors.textContent = p.colors;
  sliders.detail.value = p.detail; labels.detail.textContent = p.detail;
  sliders.blur.value   = p.blur;   labels.blur.textContent   = p.blur;
  sliders.stroke.value = p.stroke; labels.stroke.textContent = p.stroke;
  scheduleTrace(400);
}


// ── Reset ──────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  applyPreset('balanced');
  document.querySelectorAll('.preset-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.preset === 'balanced')
  );
});


// ── Download / Copy helpers ────────────────────────────────────
function downloadSvg() {
  if (!svgString) return;
  const blob = new Blob([svgString], { type: 'image/svg+xml' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: 'traced.svg',
  });
  a.click();
  URL.revokeObjectURL(a.href);
}

function copySvg(btn) {
  if (!svgString) return;
  navigator.clipboard.writeText(svgString).catch(() => {});
  const o = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = o, 1400);
}

document.getElementById('downloadSvgBtn').addEventListener('click', downloadSvg);
document.getElementById('downloadSvgBtnPanel').addEventListener('click', downloadSvg);
document.getElementById('copySvgBtn').addEventListener('click', function () { copySvg(this); });
document.getElementById('copySvgBtnPanel').addEventListener('click', function () { copySvg(this); });
document.getElementById('changeImgBtn').addEventListener('click', showDropState);
</script>
</body>
</html>
