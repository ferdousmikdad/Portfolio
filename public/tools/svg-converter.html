<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Trace</title>
  <script>
    (function () {
      if (window.self !== window.top) document.documentElement.dataset.embed = '1';
      try {
        if (window.parent.document.documentElement.classList.contains('dark'))
          document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs"></script>
  <style>
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Regular.otf') format('opentype'); font-weight:400; }
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Medium.otf')  format('opentype'); font-weight:500; }
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Semibold.otf') format('opentype'); font-weight:600; }
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Bold.otf')    format('opentype'); font-weight:700; }

    :root {
      --bg:           #F2EDD9;
      --border:       rgba(0,0,0,0.08);
      --headline:     #1c1c1e;
      --body:         #6b6861;
      --social-bg:    rgba(0,0,0,0.05);
      --social-hover: rgba(0,0,0,0.10);
      --input-bg:     rgba(0,0,0,0.04);
      --input-border: rgba(0,0,0,0.08);
      --canvas-bg:    rgba(0,0,0,0.04);
      --accent:       #cf0506;
      --scrollbar:    rgba(0,0,0,0.10);
      --slider-track: rgba(0,0,0,0.12);
    }
    .dark {
      --bg:           #080808;
      --border:       rgba(255,255,255,0.08);
      --headline:     #f3f0e5;
      --body:         #aba795;
      --social-bg:    rgba(255,255,255,0.05);
      --social-hover: rgba(255,255,255,0.10);
      --input-bg:     rgba(255,255,255,0.04);
      --input-border: rgba(255,255,255,0.08);
      --canvas-bg:    rgba(255,255,255,0.03);
      --accent:       #cf0506;
      --scrollbar:    rgba(255,255,255,0.10);
      --slider-track: rgba(255,255,255,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--headline);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    [data-embed='1'] .page-header { display: none !important; }

    /* ── Standalone header ── */
    .page-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-link { font-size:12px; font-weight:500; color:var(--body); text-decoration:none; transition:color .15s; }
    .back-link:hover { color:var(--accent); }
    .hdr-sep { width:1px; height:14px; background:var(--border); }
    .hdr-title { font-size:13px; font-weight:500; color:var(--headline); }

    /* ── Main area ── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* ══════════════════════════════════════
       DROP STATE
    ══════════════════════════════════════ */
    #dropState {
      width: 100%; flex: 1;
      display: flex; align-items: stretch;
      padding: 120px;
      min-height: 0;
    }
    :root .drop-zone {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(0,0,0,0.18)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
    }
    .dark .drop-zone {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(255,255,255,0.12)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
    }
    .drop-zone {
      width: 100%; height: 100%;
      border: none; border-radius: 14px; position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; cursor: pointer;
      transition: background-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(207,5,6,0.5)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
      background-color: rgba(207,5,6,0.03);
    }
    .drop-icon { opacity: 0.35; }
    .drop-zone-label { font-size:12px; font-weight:500; color:var(--body); opacity:.55; }
    .drop-zone input { display:none; }

    /* ══════════════════════════════════════
       IMAGE STATE — two-column layout
    ══════════════════════════════════════ */
    #imageState {
      display: none;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    #imageState.show { display: flex; }

    /* ── Left controls column ── */
    .ctrl-col {
      width: 270px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      gap: 0;
    }

    .ctrl-panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ctrl-panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .ctrl-panel-title {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--body); opacity: 0.5;
    }

    .ctrl-panel-body {
      padding: 16px 14px;
      display: flex; flex-direction: column;
      gap: 20px;
    }

    .ctrl-divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    .ctrl-group { display: flex; flex-direction: column; gap: 7px; }

    .ctrl-label-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .ctrl-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--body); opacity: 0.6;
    }
    .ctrl-value {
      font-family: 'SF Mono','Fira Code',ui-monospace,monospace;
      font-size: 10px; font-weight: 600;
      color: var(--accent);
    }

    /* ── Sliders ── */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%; height: 3px;
      border-radius: 2px;
      background: var(--slider-track);
      outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 0 2px var(--bg);
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer; border: none;
    }

    /* ── Reset button ── */
    .reset-btn {
      width: 100%; height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--body);
      font-family: inherit;
      font-size: 11px; font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .reset-btn:hover { background: var(--social-hover); color: var(--headline); }

    /* ── Right preview column ── */
    .preview-col {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
      padding: 12px 12px 12px 0;
      gap: 20px;
      min-width: 0;
    }

    /* presets row */
    .presets-row {
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .presets-label {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--body); opacity: 0.5;
      margin-right: 2px;
    }
    .preset-btn {
      height: 32px; padding: 0 14px;
      border-radius: 8px;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--social-bg);
      color: var(--body);
      font-family: inherit;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .preset-btn:hover { background: var(--social-hover); color: var(--headline); }
    .preset-btn.active {
      background: rgba(207,5,6,0.09);
      border-color: rgba(207,5,6,0.3);
      color: var(--accent);
    }

    /* images row */
    .images-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .img-pane {
      display: flex; flex-direction: column; gap: 8px;
      min-height: 0;
    }
    .img-pane-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--body); opacity: 0.5;
      flex-shrink: 0;
    }
    .img-pane-body {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--canvas-bg);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
      padding: 10px;
      width: 100%;
    }
    .img-pane-body canvas {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      display: block;
    }

    /* checker bg for SVG pane */
    .checker {
      background-image:
        linear-gradient(45deg, var(--input-bg) 25%, transparent 25%),
        linear-gradient(-45deg, var(--input-bg) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--input-bg) 75%),
        linear-gradient(-45deg, transparent 75%, var(--input-bg) 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0;
    }

    /* SVG result container */
    #svgResult {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    #svgResult svg {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto; display: block;
    }

    /* processing overlay */
    #processingOverlay {
      display: none; position: absolute; inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 10;
      border-radius: 10px;
    }
    #processingOverlay.show { display: flex; }
    .processing-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent);
    }

    /* action buttons row */
    .actions-row {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .action-btn {
      height: 32px; padding: 0 16px;
      border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background .15s, opacity .15s, color .15s;
      white-space: nowrap;
    }
    .action-btn-ghost {
      border: 1px solid var(--border);
      background: var(--social-bg);
      color: var(--body);
    }
    .action-btn-ghost:hover { background: var(--social-hover); color: var(--headline); }
    .action-btn-solid {
      border: none;
      background: var(--accent);
      color: #fff;
    }
    .action-btn-solid:hover { opacity: 0.88; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:4px; }
  </style>
</head>
<body>

<!-- Theme sync -->
<script>
(function () {
  try {
    const ph = window.parent.document.documentElement;
    const sync = () => document.documentElement.classList.toggle('dark', ph.classList.contains('dark'));
    sync();
    new MutationObserver(sync).observe(ph, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();
</script>

<!-- Standalone header -->
<div class="page-header">
  <a href="../index.html" class="back-link">← Back</a>
  <div class="hdr-sep"></div>
  <span class="hdr-title">Image Trace</span>
</div>

<!-- Main -->
<div class="main">

  <!-- ── Drop state ── -->
  <div id="dropState">
    <label id="dropZone" class="drop-zone">
      <svg class="drop-icon" width="36" height="36" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg" color="var(--body)">
        <path d="M25.1363 14.3633C24.8188 14.3633 24.5144 14.4895 24.2899 14.7139C24.0654 14.9384 23.9393 15.2429 23.9393 15.5603V20.6031C23.9384 21.4876 23.5866 22.3355 22.9612 22.9609C22.3358 23.5863 21.4878 23.9381 20.6034 23.9391H5.72988C4.84542 23.9381 3.99746 23.5863 3.37206 22.9609C2.74665 22.3355 2.39488 21.4876 2.39393 20.6031V15.5603C2.39393 15.2429 2.26782 14.9384 2.04335 14.7139C1.81887 14.4895 1.51442 14.3633 1.19697 14.3633C0.879511 14.3633 0.575058 14.4895 0.350583 14.7139C0.126109 14.9384 0 15.2429 0 15.5603V20.6031C0.00158429 22.1223 0.605775 23.5788 1.67999 24.653C2.75421 25.7272 4.21071 26.3314 5.72988 26.333H20.6034C22.1225 26.3314 23.579 25.7272 24.6533 24.653C25.7275 23.5788 26.3317 22.1223 26.3333 20.6031V15.5603C26.3333 15.2429 26.2071 14.9384 25.9827 14.7139C25.7582 14.4895 25.4537 14.3633 25.1363 14.3633Z" fill="currentColor"/>
        <path d="M6.83125 9.22476L11.9698 4.08619V19.1512C11.9698 19.4687 12.0959 19.7731 12.3204 19.9976C12.5449 20.2221 12.8493 20.3482 13.1668 20.3482C13.4842 20.3482 13.7887 20.2221 14.0132 19.9976C14.2376 19.7731 14.3638 19.4687 14.3638 19.1512V4.08619L19.5023 9.22476C19.7281 9.4428 20.0304 9.56344 20.3443 9.56072C20.6581 9.55799 20.9583 9.43211 21.1803 9.21018C21.4022 8.98825 21.5281 8.68804 21.5308 8.3742C21.5335 8.06036 21.4129 7.758 21.1948 7.53225L14.013 0.350455C13.7886 0.126059 13.4842 0 13.1668 0C12.8494 0 12.545 0.126059 12.3205 0.350455L5.13874 7.53225C4.9207 7.758 4.80005 8.06036 4.80278 8.3742C4.80551 8.68804 4.93139 8.98825 5.15332 9.21018C5.37525 9.43211 5.67546 9.55799 5.9893 9.56072C6.30314 9.56344 6.6055 9.4428 6.83125 9.22476Z" fill="currentColor"/>
      </svg>
      <p class="drop-zone-label">Click to select or drop an image</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
    </label>
  </div>

  <!-- ── Image state ── -->
  <div id="imageState">

    <!-- Left: Controls -->
    <div class="ctrl-col">
      <div class="ctrl-panel">

        <div class="ctrl-panel-header">
          <span class="ctrl-panel-title">Controls</span>
          <button id="changeImgBtn" style="background:none;border:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--body);font-family:inherit;letter-spacing:0.04em;opacity:0.6;transition:opacity .15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">⤴ Change</button>
        </div>

        <div class="ctrl-panel-body">

          <!-- Colors -->
          <div class="ctrl-group">
            <div class="ctrl-label-row">
              <span class="ctrl-label">Colors</span>
              <span class="ctrl-value" id="colorsVal">16</span>
            </div>
            <input type="range" id="colorsSlider" min="2" max="32" value="16" />
          </div>

          <div class="ctrl-divider"></div>

          <!-- Paths -->
          <div class="ctrl-group">
            <div class="ctrl-label-row">
              <span class="ctrl-label">Paths</span>
              <span class="ctrl-value" id="pathsVal">70%</span>
            </div>
            <input type="range" id="pathsSlider" min="0" max="100" value="70" />
          </div>

          <!-- Corners -->
          <div class="ctrl-group">
            <div class="ctrl-label-row">
              <span class="ctrl-label">Corners</span>
              <span class="ctrl-value" id="cornersVal">25%</span>
            </div>
            <input type="range" id="cornersSlider" min="0" max="100" value="25" />
          </div>

          <div class="ctrl-divider"></div>

          <!-- Noise -->
          <div class="ctrl-group">
            <div class="ctrl-label-row">
              <span class="ctrl-label">Noise</span>
              <span class="ctrl-value" id="noiseVal">0</span>
            </div>
            <input type="range" id="noiseSlider" min="0" max="5" value="0" />
          </div>

          <!-- Stroke Width -->
          <div class="ctrl-group">
            <div class="ctrl-label-row">
              <span class="ctrl-label">Stroke Width</span>
              <span class="ctrl-value" id="strokeVal">0</span>
            </div>
            <input type="range" id="strokeSlider" min="0" max="5" value="0" />
          </div>

          <div class="ctrl-divider"></div>

          <!-- Reset -->
          <button class="reset-btn" id="resetBtn">Reset Controls</button>

        </div>
      </div>
    </div>

    <!-- Right: Preview -->
    <div class="preview-col">

      <!-- Presets -->
      <div class="presets-row">
        <span class="presets-label">Presets</span>
        <button class="preset-btn active" data-preset="balanced">Balanced</button>
        <button class="preset-btn" data-preset="photo">Photo</button>
        <button class="preset-btn" data-preset="flat">Flat</button>
        <button class="preset-btn" data-preset="bw">B&amp;W</button>
        <button class="preset-btn" data-preset="sketch">Sketch</button>
      </div>

      <!-- Images -->
      <div class="images-row">
        <div class="img-pane">
          <span class="img-pane-label">Original</span>
          <div class="img-pane-body">
            <canvas id="originalCanvas"></canvas>
          </div>
        </div>
        <div class="img-pane">
          <span class="img-pane-label">SVG Output</span>
          <div class="img-pane-body checker">
            <div id="svgResult"></div>
            <div id="processingOverlay">
              <span class="processing-label">Tracing…</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-row">
        <button id="copySvgBtn" class="action-btn action-btn-ghost">Copy SVG</button>
        <button id="downloadSvgBtn" class="action-btn action-btn-solid">↓ Download</button>
      </div>

    </div>
  </div><!-- /imageState -->

</div><!-- /main -->


<script>
'use strict';

// colors, paths (0-100%), corners (0-100%), noise (0-5), stroke (0-5)
const PRESETS = {
  balanced: { colors: 16, paths: 70, corners: 25, noise: 0, stroke: 0 },
  photo:    { colors: 32, paths: 88, corners: 15, noise: 0, stroke: 0 },
  flat:     { colors: 8,  paths: 55, corners: 80, noise: 1, stroke: 0 },
  bw:       { colors: 2,  paths: 75, corners: 65, noise: 1, stroke: 0 },
  sketch:   { colors: 2,  paths: 85, corners: 20, noise: 0, stroke: 1 },
};

let sourceImg  = null;
let svgString  = '';
let traceTimer = null;

const dropState         = document.getElementById('dropState');
const imageState        = document.getElementById('imageState');
const dropZone          = document.getElementById('dropZone');
const fileInput         = document.getElementById('fileInput');
const originalCanvas    = document.getElementById('originalCanvas');
const svgResult         = document.getElementById('svgResult');
const processingOverlay = document.getElementById('processingOverlay');

const sliders = {
  colors:  document.getElementById('colorsSlider'),
  paths:   document.getElementById('pathsSlider'),
  corners: document.getElementById('cornersSlider'),
  noise:   document.getElementById('noiseSlider'),
  stroke:  document.getElementById('strokeSlider'),
};
const labels = {
  colors:  document.getElementById('colorsVal'),
  paths:   document.getElementById('pathsVal'),
  corners: document.getElementById('cornersVal'),
  noise:   document.getElementById('noiseVal'),
  stroke:  document.getElementById('strokeVal'),
};

const MAX_PX = 800;

function showImageState() {
  dropState.style.display = 'none';
  imageState.classList.add('show');
}
function showDropState() {
  imageState.classList.remove('show');
  dropState.style.display = '';
  sourceImg = null;
  svgString = '';
  svgResult.innerHTML = '';
}

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth  * scale);
      const h = Math.round(img.naturalHeight * scale);
      originalCanvas.width  = w;
      originalCanvas.height = h;
      originalCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
      sourceImg = img;
      showImageState();
      scheduleTrace();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getOptions() {
  const paths   = +sliders.paths.value;   // 0–100
  const corners = +sliders.corners.value; // 0–100
  const noise   = +sliders.noise.value;

  // Paths → base error threshold (100% paths = very accurate = low threshold)
  const baseErr = Math.max(0.1, (100 - paths) * 0.1); // 10→0.1 as paths 0→100

  // Corners → balance between straight lines (ltres) and curves (qtres)
  // High corners: stricter straight lines (lower ltres), lenient curves (higher qtres) → angular
  // Low corners: lenient straight lines (higher ltres), accurate curves (lower qtres) → smooth
  const cRatio = corners / 100;
  const ltres  = Math.max(0.1, baseErr * (1 - cRatio * 0.7));
  const qtres  = Math.max(0.1, baseErr * (1 + cRatio * 2.5));

  // Noise slider → pathomit (remove tiny paths) + blur
  const pathomit = Math.max(1, Math.round(1 + noise * 3));

  return {
    numberofcolors:      +sliders.colors.value,
    colorsampling:       1,
    colorquantcycles:    3,
    ltres, qtres,
    pathomit,
    blurradius:          noise,
    blurdelta:           20,
    strokewidth:         +sliders.stroke.value,
    rightangleenhance:   corners > 55,
    scale:               1,
    roundcoords:         1,
  };
}

function scheduleTrace(delay = 800) {
  clearTimeout(traceTimer);
  traceTimer = setTimeout(runTrace, delay);
}

function runTrace() {
  if (!sourceImg) return;
  processingOverlay.classList.add('show');
  setTimeout(() => {
    const off = document.createElement('canvas');
    off.width  = originalCanvas.width;
    off.height = originalCanvas.height;
    off.getContext('2d').drawImage(sourceImg, 0, 0, off.width, off.height);
    const imgData = off.getContext('2d').getImageData(0, 0, off.width, off.height);
    try {
      svgString = ImageTracer.imagedataToSVG(imgData, getOptions());
      svgResult.innerHTML = svgString;
      const svg = svgResult.querySelector('svg');
      if (svg) {
        const w = svg.getAttribute('width'), h = svg.getAttribute('height');
        if (w && h && !svg.getAttribute('viewBox')) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.removeAttribute('width');
        svg.removeAttribute('height');
      }
    } catch (err) {
      svgResult.innerHTML = `<span style="font-size:10px;color:var(--accent);">Trace failed: ${err.message}</span>`;
    }
    processingOverlay.classList.remove('show');
  }, 30);
}

// Drag & drop
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

// Sliders
Object.entries(sliders).forEach(([key, el]) => {
  el.addEventListener('input', () => {
    const isPct = key === 'paths' || key === 'corners';
    labels[key].textContent = isPct ? el.value + '%' : el.value;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    scheduleTrace();
  });
});

// Presets
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyPreset(btn.dataset.preset);
  });
});

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  sliders.colors.value  = p.colors;  labels.colors.textContent  = p.colors;
  sliders.paths.value   = p.paths;   labels.paths.textContent   = p.paths + '%';
  sliders.corners.value = p.corners; labels.corners.textContent = p.corners + '%';
  sliders.noise.value   = p.noise;   labels.noise.textContent   = p.noise;
  sliders.stroke.value  = p.stroke;  labels.stroke.textContent  = p.stroke;
  scheduleTrace(400);
}

// Reset
document.getElementById('resetBtn').addEventListener('click', () => {
  applyPreset('balanced');
  document.querySelectorAll('.preset-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.preset === 'balanced')
  );
});

// Change image
document.getElementById('changeImgBtn').addEventListener('click', showDropState);

// Copy SVG
document.getElementById('copySvgBtn').addEventListener('click', function () {
  if (!svgString) return;
  navigator.clipboard.writeText(svgString).catch(() => {});
  const orig = this.textContent;
  this.textContent = 'Copied!';
  this.style.color = '#22c55e'; this.style.borderColor = 'rgba(34,197,94,0.35)';
  setTimeout(() => { this.textContent = orig; this.style.color = ''; this.style.borderColor = ''; }, 1800);
});

// Download SVG
document.getElementById('downloadSvgBtn').addEventListener('click', () => {
  if (!svgString) return;
  const blob = new Blob([svgString], { type: 'image/svg+xml' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: 'traced.svg',
  });
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
