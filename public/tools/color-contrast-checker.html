<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Contrast Checker</title>
  <script>
    (function () {
      if (window.self !== window.top) document.documentElement.dataset.embed = '1';
      try {
        if (window.parent.document.documentElement.classList.contains('dark'))
          document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    :root {
      --bg:           #F2EDD9;
      --border:       rgba(0, 0, 0, 0.08);
      --headline:     #1c1c1e;
      --body:         #6b6861;
      --social-bg:    rgba(0, 0, 0, 0.05);
      --social-hover: rgba(0, 0, 0, 0.10);
      --input-bg:     rgba(0, 0, 0, 0.04);
      --input-border: rgba(0, 0, 0, 0.08);
      --divider:      rgba(0, 0, 0, 0.06);
      --accent:       #cf0506;
      --scrollbar:    rgba(0, 0, 0, 0.10);
    }
    .dark {
      --bg:           #080808;
      --border:       rgba(255, 255, 255, 0.08);
      --headline:     #f3f0e5;
      --body:         #aba795;
      --social-bg:    rgba(255, 255, 255, 0.05);
      --social-hover: rgba(255, 255, 255, 0.10);
      --input-bg:     rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.08);
      --divider:      rgba(255, 255, 255, 0.05);
      --accent:       #cf0506;
      --scrollbar:    rgba(255, 255, 255, 0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      background: var(--bg);
      color: var(--headline);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    [data-embed='1'] .page-header { display: none !important; }

    /* ── Standalone header ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-link {
      font-size: 12px; font-weight: 500;
      color: var(--body); text-decoration: none;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }
    .hdr-sep { width: 1px; height: 14px; background: var(--border); }
    .hdr-title { font-size: 13px; font-weight: 500; color: var(--headline); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .toolbar-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--body);
      opacity: 0.6;
      margin-right: 4px;
    }

    .btn {
      height: 28px;
      padding: 0 12px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--social-bg);
      color: var(--body);
      font-family: inherit;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--social-hover);
      color: var(--headline);
      border-color: rgba(0,0,0,0.2);
    }
    .dark .btn:hover { border-color: rgba(255,255,255,0.2); }

    /* ── Main two-panel layout ── */
    .panels {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Left panel ── */
    .left-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    /* Color row — background */
    .color-row {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 20px;
      gap: 10px;
    }

    .color-row + .color-row {
      border-top: 1px solid var(--divider);
    }

    .row-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--body);
      opacity: 0.55;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .swatch-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .swatch-dot:hover { transform: scale(1.3); }

    /* Hex field row */
    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hex-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 9px 11px;
      transition: border-color 0.2s;
    }
    .hex-box:focus-within { border-color: var(--accent); }

    .hex-pound {
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 12px; font-weight: 600;
      color: var(--body); opacity: 0.4;
    }

    .hex-input {
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 14px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      width: 100%;
      background: transparent;
      border: none; outline: none;
      color: var(--headline);
    }

    .picker-btn {
      width: 36px; height: 36px;
      border-radius: 9px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, transform 0.15s;
    }
    .picker-btn:hover { border-color: var(--body); transform: scale(1.06); }

    .picker-swatch {
      position: absolute; inset: 0;
      pointer-events: none;
      transition: background 0.2s;
    }

    input[type="color"] {
      position: absolute;
      top: -6px; left: -6px;
      width: calc(100% + 12px);
      height: calc(100% + 12px);
      opacity: 0; cursor: pointer;
      border: none; padding: 0;
    }

    /* ── Ratio strip (bottom of left panel) ── */
    .ratio-strip {
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .ratio-block {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .ratio-number {
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
      transition: color 0.25s;
    }
    .ratio-good { color: #22c55e; }
    .ratio-ok   { color: #f59e0b; }
    .ratio-bad  { color: var(--accent); }

    .ratio-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--body); opacity: 0.4;
    }

    .main-badge {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.04em;
      transition: all 0.25s;
    }
    .main-badge.pass { background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.25); color: #22c55e; }
    .main-badge.fail { background: rgba(207,5,6,0.08);  border-color: rgba(207,5,6,0.20);  color: var(--accent); }

    /* WCAG pills row */
    .wcag-row {
      width: 100%;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .wcag-pill {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--social-bg);
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.04em;
      transition: all 0.25s;
    }
    .wcag-pill.pass { border-color: rgba(34,197,94,0.25); background: rgba(34,197,94,0.07); }
    .wcag-pill.fail { border-color: rgba(207,5,6,0.15);  background: rgba(207,5,6,0.05); }
    .wcag-pill-label { color: var(--body); opacity: 0.65; }
    .wcag-pill.pass .wcag-pill-icon { color: #22c55e; }
    .wcag-pill.fail .wcag-pill-icon { color: var(--accent); }

    /* ── Right panel ── */
    .right-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tabs-row {
      display: flex;
      padding: 0 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 10px 14px;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      border: none;
      border-bottom: 1.5px solid transparent;
      margin-bottom: -1px;
      color: var(--body);
      background: none;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--headline); }
    .tab-btn.active { color: var(--headline); border-bottom-color: var(--accent); }

    /* Preview fill */
    .preview-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: stretch;
    }

    .preview-area {
      flex: 1;
      padding: 36px 32px;
      transition: background 0.25s, color 0.25s;
      overflow-y: auto;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 18px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--input-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      color: var(--headline);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    /* ── Mobile stack ── */
    @media (max-width: 600px) {
      body { overflow-y: auto; }
      .panels {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow: visible;
      }
      .left-panel { border-right: none; border-bottom: 1px solid var(--border); }
      .right-panel { min-height: 260px; }
      .preview-area { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<!-- Standalone header -->
<div class="page-header">
  <a href="../index.html" class="back-link">← Back</a>
  <div class="hdr-sep"></div>
  <span class="hdr-title">Color Contrast Checker</span>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <span class="toolbar-label">Color Contrast Checker</span>
  <button id="swapBtn" class="btn">⇄ Swap</button>
  <button id="randomBtn" class="btn">⚄ Random</button>
</div>

<!-- Two-panel layout -->
<div class="panels">

  <!-- ── Left: color inputs ── -->
  <div class="left-panel">

    <!-- Background row -->
    <div class="color-row">
      <div class="row-label">
        <div class="swatch-dot" id="bgSwatch" title="Click to copy"></div>
        Background
      </div>
      <div class="field-row">
        <div class="hex-box">
          <span class="hex-pound">#</span>
          <input type="text" id="bgHexInput" class="hex-input" maxlength="6" value="A60000" spellcheck="false" autocomplete="off" />
        </div>
        <div class="picker-btn" id="bgPickerWrap" title="Pick (dbl-click to copy)">
          <div class="picker-swatch" id="bgPickerSwatch"></div>
          <input type="color" id="bgPicker" value="#A60000" />
        </div>
      </div>
    </div>

    <!-- Text row -->
    <div class="color-row">
      <div class="row-label">
        <div class="swatch-dot" id="textSwatch" title="Click to copy"></div>
        Text Color
      </div>
      <div class="field-row">
        <div class="hex-box">
          <span class="hex-pound">#</span>
          <input type="text" id="textHexInput" class="hex-input" maxlength="6" value="FFFFFF" spellcheck="false" autocomplete="off" />
        </div>
        <div class="picker-btn" id="textPickerWrap" title="Pick (dbl-click to copy)">
          <div class="picker-swatch" id="textPickerSwatch"></div>
          <input type="color" id="textPicker" value="#FFFFFF" />
        </div>
      </div>
    </div>

    <!-- Ratio + WCAG -->
    <div class="ratio-strip">
      <div class="ratio-block">
        <span id="ratioDisplay" class="ratio-number ratio-bad">—</span>
        <span class="ratio-label">Ratio</span>
      </div>
      <div class="main-badge fail" id="mainBadge">
        <span id="mainBadgeIcon">✖</span>
        <span>AA Normal</span>
      </div>
      <div class="wcag-row">
        <div class="wcag-pill" id="aaLargePill">
          <span class="wcag-pill-icon" id="aaLargeIcon">—</span>
          <span class="wcag-pill-label">AA Large</span>
        </div>
        <div class="wcag-pill" id="aaaPill">
          <span class="wcag-pill-icon" id="aaaIcon">—</span>
          <span class="wcag-pill-label">AAA</span>
        </div>
        <div class="wcag-pill" id="aaaLargePill">
          <span class="wcag-pill-icon" id="aaaLargeIcon">—</span>
          <span class="wcag-pill-label">AAA Large</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Right: preview ── -->
  <div class="right-panel">

    <div class="tabs-row">
      <button class="tab-btn active" data-mode="heading">Heading</button>
      <button class="tab-btn" data-mode="body">Body Text</button>
    </div>

    <div class="preview-wrap">
      <div id="previewArea" class="preview-area"></div>
    </div>

  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict';

// ── Theme sync ───────────────────────────────────────────────────────────────
(function () {
  try {
    const ph = window.parent.document.documentElement;
    const sync = () => document.documentElement.classList.toggle('dark', ph.classList.contains('dark'));
    sync();
    new MutationObserver(sync).observe(ph, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();

// ── State ────────────────────────────────────────────────────────────────────
let bgHex   = 'a60000';
let textHex = 'ffffff';
let mode    = 'heading';

// ── DOM ──────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

const bgHexInput       = $('bgHexInput');
const textHexInput     = $('textHexInput');
const bgPicker         = $('bgPicker');
const textPicker       = $('textPicker');
const bgSwatch         = $('bgSwatch');
const textSwatch       = $('textSwatch');
const bgPickerSwatch   = $('bgPickerSwatch');
const textPickerSwatch = $('textPickerSwatch');
const ratioDisplay     = $('ratioDisplay');
const mainBadge        = $('mainBadge');
const mainBadgeIcon    = $('mainBadgeIcon');
const previewArea      = $('previewArea');
const toast            = $('toast');

// ── Color math ───────────────────────────────────────────────────────────────
const isHex    = h  => /^[0-9A-Fa-f]{6}$/.test(h);
const toRgb    = h  => ({ r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) });
const toLinear = c  => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const lum      = h  => { const {r,g,b} = toRgb(h); return 0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b); };
const contrast = (a,b) => { const L1=lum(a), L2=lum(b); return (Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05); };
const randHex  = () => Math.floor(Math.random()*0xFFFFFF).toString(16).padStart(6,'0').toUpperCase();
const cleanHex = raw => { let h=raw.replace(/^#/,'').toUpperCase(); if(/^[0-9A-F]{3}$/.test(h)) h=h.split('').map(c=>c+c).join(''); return h; };

// ── WCAG pill helper ─────────────────────────────────────────────────────────
function setPill(pillEl, iconEl, pass) {
  pillEl.className   = 'wcag-pill ' + (pass ? 'pass' : 'fail');
  iconEl.textContent = pass ? '✔' : '✖';
}

// ── Preview templates ────────────────────────────────────────────────────────
const TEMPLATES = {
  heading: () => `
    <p style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.35;margin-bottom:20px;font-weight:600;font-family:inherit;">Preview</p>
    <h1 style="font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:700;line-height:1.15;margin-bottom:14px;letter-spacing:-0.025em;font-family:inherit;">
      The quick brown fox jumps over the lazy dog
    </h1>
    <h2 style="font-size:clamp(.95rem,2vw,1.2rem);font-weight:500;line-height:1.5;opacity:.75;font-family:inherit;">
      Good design is obvious. Great design is transparent.
    </h2>`,

  body: () => `
    <p style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.35;margin-bottom:20px;font-weight:600;font-family:inherit;">Preview</p>
    <p style="font-size:.9rem;line-height:1.8;margin-bottom:14px;opacity:.9;font-family:inherit;">
      Typography is the craft of enduring visual communication and the
      foundation of readable, accessible design. Every choice in font,
      weight, and spacing shapes how well users can consume your content.
    </p>
    <p style="font-size:.8rem;line-height:1.7;opacity:.55;font-family:inherit;">
      WCAG 2.1 requires 4.5:1 contrast for normal text and 3:1 for large
      text (18pt+ or 14pt bold). AAA requires 7:1 for normal text.
    </p>`,
};

// ── Apply ────────────────────────────────────────────────────────────────────
function apply() {
  const bg = '#' + bgHex, tx = '#' + textHex;

  bgSwatch.style.background         = bg;
  textSwatch.style.background       = tx;
  bgPickerSwatch.style.background   = bg;
  textPickerSwatch.style.background = tx;
  bgHexInput.value   = bgHex.toUpperCase();
  textHexInput.value = textHex.toUpperCase();
  bgPicker.value     = bg;
  textPicker.value   = tx;

  const ratio  = contrast(bgHex, textHex);
  ratioDisplay.textContent = ratio.toFixed(2) + ':1';
  ratioDisplay.className   = 'ratio-number ' + (ratio >= 7 ? 'ratio-good' : ratio >= 4.5 ? 'ratio-ok' : 'ratio-bad');

  const aaPass = ratio >= 4.5;
  mainBadge.className       = 'main-badge ' + (aaPass ? 'pass' : 'fail');
  mainBadgeIcon.textContent = aaPass ? '✔' : '✖';

  setPill($('aaLargePill'),  $('aaLargeIcon'),  ratio >= 3.0);
  setPill($('aaaPill'),      $('aaaIcon'),       ratio >= 7.0);
  setPill($('aaaLargePill'), $('aaaLargeIcon'), ratio >= 4.5);

  previewArea.style.background = bg;
  previewArea.style.color      = tx;
  previewArea.innerHTML        = (TEMPLATES[mode] || TEMPLATES.heading)();
}

// ── Inputs ───────────────────────────────────────────────────────────────────
bgHexInput.addEventListener('input', () => {
  const h = cleanHex(bgHexInput.value);
  if (isHex(h)) { bgHex = h.toLowerCase(); apply(); }
});
bgHexInput.addEventListener('blur', () => {
  if (!isHex(cleanHex(bgHexInput.value))) bgHexInput.value = bgHex.toUpperCase();
});

textHexInput.addEventListener('input', () => {
  const h = cleanHex(textHexInput.value);
  if (isHex(h)) { textHex = h.toLowerCase(); apply(); }
});
textHexInput.addEventListener('blur', () => {
  if (!isHex(cleanHex(textHexInput.value))) textHexInput.value = textHex.toUpperCase();
});

bgPicker.addEventListener('input',   () => { bgHex   = bgPicker.value.slice(1).toLowerCase();   apply(); });
textPicker.addEventListener('input', () => { textHex = textPicker.value.slice(1).toLowerCase(); apply(); });

// ── Controls ─────────────────────────────────────────────────────────────────
$('swapBtn').addEventListener('click',   () => { [bgHex, textHex] = [textHex, bgHex]; apply(); });
$('randomBtn').addEventListener('click', () => { bgHex = randHex().toLowerCase(); textHex = randHex().toLowerCase(); apply(); });

// ── Tabs ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    apply();
  });
});

// ── Copy ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}
function copyHex(hex) {
  navigator.clipboard.writeText('#' + hex.toUpperCase())
    .then(() => showToast('Copied #' + hex.toUpperCase()))
    .catch(() => {});
}

bgSwatch.addEventListener('click',           () => copyHex(bgHex));
textSwatch.addEventListener('click',         () => copyHex(textHex));
$('bgPickerWrap').addEventListener('dblclick',   () => copyHex(bgHex));
$('textPickerWrap').addEventListener('dblclick', () => copyHex(textHex));

// ── Init ─────────────────────────────────────────────────────────────────────
apply();
</script>
</body>
</html>
