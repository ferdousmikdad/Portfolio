<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Dot Effect</title>
  <script>
    (function () {
      if (window.self !== window.top) document.documentElement.dataset.embed = '1';
      try {
        if (window.parent.document.documentElement.classList.contains('dark'))
          document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    /* ── Website design tokens ── */
    :root {
      --bg:           #F2EDD9;
      --panel-bg:     rgba(0, 0, 0, 0.03);
      --border:       rgba(0, 0, 0, 0.08);
      --headline:     #1c1c1e;
      --body:         #6b6861;
      --social-bg:    rgba(0, 0, 0, 0.05);
      --social-hover: rgba(0, 0, 0, 0.10);
      --input-bg:     rgba(0, 0, 0, 0.04);
      --input-border: rgba(0, 0, 0, 0.08);
      --canvas-bg:    rgba(0, 0, 0, 0.04);
      --accent:       #cf0506;
      --scrollbar:    rgba(0, 0, 0, 0.10);
      --slider-track: rgba(0, 0, 0, 0.12);
    }
    .dark {
      --bg:           #080808;
      --panel-bg:     rgba(255, 255, 255, 0.02);
      --border:       rgba(255, 255, 255, 0.08);
      --headline:     #f3f0e5;
      --body:         #aba795;
      --social-bg:    rgba(255, 255, 255, 0.05);
      --social-hover: rgba(255, 255, 255, 0.10);
      --input-bg:     rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.08);
      --canvas-bg:    rgba(255, 255, 255, 0.03);
      --accent:       #cf0506;
      --scrollbar:    rgba(255, 255, 255, 0.10);
      --slider-track: rgba(255, 255, 255, 0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      background: var(--bg);
      color: var(--headline);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    [data-embed='1'] .page-header { display: none !important; }

    /* ── Standalone header ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-link {
      font-size: 12px; font-weight: 500;
      color: var(--body); text-decoration: none;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }
    .hdr-sep { width: 1px; height: 14px; background: var(--border); }
    .hdr-title { font-size: 13px; font-weight: 500; color: var(--headline); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 11px; font-weight: 500;
      color: var(--body); opacity: 0.6;
    }

    .toolbar-sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }

    .preset-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--body); opacity: 0.45;
    }

    /* ── Shared button ── */
    .btn {
      height: 26px;
      padding: 0 11px;
      border-radius: 7px;
      font-size: 11px; font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--social-bg);
      color: var(--body);
      font-family: inherit;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--social-hover);
      color: var(--headline);
    }
    .btn.active {
      background: rgba(207, 5, 6, 0.09);
      border-color: rgba(207, 5, 6, 0.3);
      color: var(--accent);
    }
    .btn-solid {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-solid:hover { opacity: 0.88; }

    /* ── Presets bar (shown after upload) ── */
    #presetsBar { display: none; }
    #presetsBar.show { display: contents; }
    .toolbar:not(:has(#presetsBar.show)) { display: none; }

    /* ── Main scrollable area ── */
    .main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      gap: 14px;
      min-height: 0;
    }

    /* ── Drop state ── */
    #dropState {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: stretch;
      padding: 120px;
      min-height: 0;
    }

    .drop-zone {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover,
    .drop-zone.drag-over {
      background-color: rgba(207, 5, 6, 0.03);
    }

    .drop-icon { opacity: 0.35; }

    .drop-zone-label {
      font-size: 12px; font-weight: 500;
      color: var(--body);
      opacity: 0.55;
    }

    .drop-zone input { display: none; }

    :root .drop-zone {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(0,0,0,0.18)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
    }
    .dark .drop-zone {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(255,255,255,0.12)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
    }
    .drop-zone:hover,
    .drop-zone.drag-over {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(207,5,6,0.5)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
    }

    /* ── Image state ── */
    #imageState {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 900px;
    }
    #imageState.show { display: flex; }

    /* ── Section card ── */
    .tool-card {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--social-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .card-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .card-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--body); opacity: 0.55;
    }

    .card-header-actions {
      display: flex;
      gap: 6px;
    }

    /* ── Preview panels ── */
    .panels-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .img-panel { display: flex; flex-direction: column; }
    .img-panel:first-child { border-right: 1px solid var(--border); }

    .img-panel-body {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--canvas-bg);
      overflow: hidden;
      position: relative;
    }

    canvas {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      display: block;
    }

    /* ── Controls ── */
    .controls-body {
      padding: 18px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px 24px;
      align-items: start;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ctrl-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ctrl-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--body); opacity: 0.6;
    }

    .ctrl-value {
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 10px; font-weight: 600;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ── Range sliders ── */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%; height: 3px;
      border-radius: 2px;
      background: var(--slider-track);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: none; cursor: pointer;
    }

    /* ── Shape toggle ── */
    .shape-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--input-bg);
    }
    .shape-btn {
      flex: 1;
      padding: 7px 0;
      font-size: 11px; font-weight: 500;
      background: transparent;
      color: var(--body);
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .shape-btn + .shape-btn { border-left: 1px solid var(--border); }
    .shape-btn.active {
      background: rgba(207, 5, 6, 0.09);
      color: var(--accent);
    }

    /* ── Color picker row ── */
    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-swatch-wrap {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .color-swatch-wrap:hover { border-color: var(--body); transform: scale(1.06); }

    input[type="color"] {
      -webkit-appearance: none;
      border: none; padding: 0; background: none; cursor: pointer;
      width: 42px; height: 42px;
      margin: -5px;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; }

    .color-hex-val {
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 11px; font-weight: 500;
      color: var(--body);
    }

    /* ── Reset button ── */
    .reset-btn {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--body);
      font-size: 11px; font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      margin-top: 2px;
    }
    .reset-btn:hover { background: var(--social-hover); color: var(--headline); }

    /* ── Processing overlay ── */
    #processingOverlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
      z-index: 10;
    }
    #processingOverlay.show { display: flex; }

    .processing-label {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    @media (max-width: 620px) {
      .panels-row { grid-template-columns: 1fr; }
      .img-panel:first-child { border-right: none; border-bottom: 1px solid var(--border); }
      .controls-body { grid-template-columns: 1fr 1fr; }
      .main { padding: 16px 12px 24px; }
    }
  </style>
</head>
<body>

<!-- Theme sync -->
<script>
(function () {
  try {
    const ph = window.parent.document.documentElement;
    const sync = () => document.documentElement.classList.toggle('dark', ph.classList.contains('dark'));
    sync();
    new MutationObserver(sync).observe(ph, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();
</script>

<!-- Standalone header -->
<div class="page-header">
  <a href="../index.html" class="back-link">← Back</a>
  <div class="hdr-sep"></div>
  <span class="hdr-title">Retro Dot Effect</span>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div id="presetsBar">
    <div class="toolbar-sep"></div>
    <span class="preset-label">Presets</span>
    <button class="btn active" data-preset="comic">Comic</button>
    <button class="btn" data-preset="soft">Soft</button>
    <button class="btn" data-preset="heavy">Heavy Ink</button>
    <button class="btn" data-preset="blueprint">Blueprint</button>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Drop state -->
  <div id="dropState">
    <label id="dropZone" class="drop-zone">
      <svg class="drop-icon" width="36" height="36" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M25.1363 14.3633C24.8188 14.3633 24.5144 14.4895 24.2899 14.7139C24.0654 14.9384 23.9393 15.2429 23.9393 15.5603V20.6031C23.9384 21.4876 23.5866 22.3355 22.9612 22.9609C22.3358 23.5863 21.4878 23.9381 20.6034 23.9391H5.72988C4.84542 23.9381 3.99746 23.5863 3.37206 22.9609C2.74665 22.3355 2.39488 21.4876 2.39393 20.6031V15.5603C2.39393 15.2429 2.26782 14.9384 2.04335 14.7139C1.81887 14.4895 1.51442 14.3633 1.19697 14.3633C0.879511 14.3633 0.575058 14.4895 0.350583 14.7139C0.126109 14.9384 0 15.2429 0 15.5603V20.6031C0.00158429 22.1223 0.605775 23.5788 1.67999 24.653C2.75421 25.7272 4.21071 26.3314 5.72988 26.333H20.6034C22.1225 26.3314 23.579 25.7272 24.6533 24.653C25.7275 23.5788 26.3317 22.1223 26.3333 20.6031V15.5603C26.3333 15.2429 26.2071 14.9384 25.9827 14.7139C25.7582 14.4895 25.4537 14.3633 25.1363 14.3633Z" fill="currentColor"/>
        <path d="M6.83125 9.22476L11.9698 4.08619V19.1512C11.9698 19.4687 12.0959 19.7731 12.3204 19.9976C12.5449 20.2221 12.8493 20.3482 13.1668 20.3482C13.4842 20.3482 13.7887 20.2221 14.0132 19.9976C14.2376 19.7731 14.3638 19.4687 14.3638 19.1512V4.08619L19.5023 9.22476C19.7281 9.4428 20.0304 9.56344 20.3443 9.56072C20.6581 9.55799 20.9583 9.43211 21.1803 9.21018C21.4022 8.98825 21.5281 8.68804 21.5308 8.3742C21.5335 8.06036 21.4129 7.758 21.1948 7.53225L14.013 0.350455C13.7886 0.126059 13.4842 0 13.1668 0C12.8494 0 12.545 0.126059 12.3205 0.350455L5.13874 7.53225C4.9207 7.758 4.80005 8.06036 4.80278 8.3742C4.80551 8.68804 4.93139 8.98825 5.15332 9.21018C5.37525 9.43211 5.67546 9.55799 5.9893 9.56072C6.30314 9.56344 6.6055 9.4428 6.83125 9.22476Z" fill="currentColor"/>
      </svg>
      <p class="drop-zone-label">Click to select or drop an image</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
    </label>
  </div>

  <!-- Image state -->
  <div id="imageState">

    <!-- Preview card -->
    <div class="tool-card">
      <div class="panels-row">

        <!-- Original -->
        <div class="img-panel">
          <div class="card-header">
            <span class="card-label">Original</span>
            <button id="changeImageBtn" class="btn">⤴ Change Image</button>
          </div>
          <div class="img-panel-body">
            <canvas id="originalCanvas"></canvas>
          </div>
        </div>

        <!-- Halftone -->
        <div class="img-panel">
          <div class="card-header">
            <span class="card-label">Halftone Result</span>
            <div class="card-header-actions">
              <button id="downloadSvg" class="btn">SVG</button>
              <button id="downloadPng" class="btn btn-solid">↓ PNG</button>
            </div>
          </div>
          <div class="img-panel-body">
            <canvas id="halftoneCanvas"></canvas>
            <div id="processingOverlay">
              <span class="processing-label">Rendering…</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Controls card -->
    <div class="tool-card" id="controlsCard">
      <div class="card-header">
        <span class="card-label">Controls</span>
      </div>
      <div class="controls-body">

        <!-- Dot Shape -->
        <div class="ctrl-group">
          <span class="ctrl-label">Dot Shape</span>
          <div class="shape-toggle">
            <button class="shape-btn active" data-shape="circle">● Circle</button>
            <button class="shape-btn" data-shape="square">■ Square</button>
          </div>
        </div>

        <!-- Dot Spacing -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Dot Spacing</span>
            <span id="spacingVal" class="ctrl-value">10px</span>
          </div>
          <input type="range" id="spacing" min="4" max="40" value="10" />
        </div>

        <!-- Max Dot Size -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Max Dot Size</span>
            <span id="maxSizeVal" class="ctrl-value">90%</span>
          </div>
          <input type="range" id="maxSize" min="10" max="100" value="90" />
        </div>

        <!-- Min Dot Size -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Min Dot Size</span>
            <span id="minSizeVal" class="ctrl-value">0%</span>
          </div>
          <input type="range" id="minSize" min="0" max="50" value="0" />
        </div>

        <!-- Contrast -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Contrast</span>
            <span id="contrastVal" class="ctrl-value">0</span>
          </div>
          <input type="range" id="contrast" min="-100" max="100" value="0" />
        </div>

        <!-- Brightness -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Brightness</span>
            <span id="brightnessVal" class="ctrl-value">0</span>
          </div>
          <input type="range" id="brightness" min="-100" max="100" value="0" />
        </div>

        <!-- Rotation -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <span class="ctrl-label">Rotation</span>
            <span id="angleVal" class="ctrl-value">0°</span>
          </div>
          <input type="range" id="angle" min="0" max="90" value="0" />
        </div>

        <!-- Dot Color -->
        <div class="ctrl-group">
          <span class="ctrl-label">Dot Color</span>
          <div class="color-picker-row">
            <div class="color-swatch-wrap">
              <input type="color" id="dotColor" value="#000000" />
            </div>
            <span id="dotColorVal" class="color-hex-val">#000000</span>
          </div>
        </div>

        <!-- Background Color -->
        <div class="ctrl-group">
          <span class="ctrl-label">Background</span>
          <div class="color-picker-row">
            <div class="color-swatch-wrap">
              <input type="color" id="bgColor" value="#ffffff" />
            </div>
            <span id="bgColorVal" class="color-hex-val">#ffffff</span>
          </div>
        </div>

        <!-- Reset -->
        <div class="ctrl-group" style="justify-content: flex-end;">
          <button id="resetBtn" class="reset-btn">Reset Controls</button>
        </div>

      </div>
    </div>

  </div><!-- /imageState -->

</div><!-- /main -->


<script>
'use strict';

// ── Presets ──────────────────────────────────────────────────────────────────
const PRESETS = {
  comic:     { spacing: 8,  maxSize: 95,  minSize: 0,  contrast: 30,  brightness: 0,   angle: 45, dotColor: '#000000', bgColor: '#ffffff' },
  soft:      { spacing: 14, maxSize: 68,  minSize: 5,  contrast: -10, brightness: 10,  angle: 0,  dotColor: '#1a1a1a', bgColor: '#f5f5f0' },
  heavy:     { spacing: 6,  maxSize: 100, minSize: 0,  contrast: 55,  brightness: -10, angle: 45, dotColor: '#000000', bgColor: '#ffffff' },
  blueprint: { spacing: 10, maxSize: 80,  minSize: 0,  contrast: 20,  brightness: 0,   angle: 0,  dotColor: '#dce8ff', bgColor: '#0a2463' },
};

const DEFAULTS = {
  spacing: 10, maxSize: 90, minSize: 0,
  contrast: 0, brightness: 0, angle: 0,
  dotColor: '#000000', bgColor: '#ffffff', shape: 'circle',
};

const MAX_PX = 900;

// ── State ────────────────────────────────────────────────────────────────────
let sourcePixels  = null;
let srcW = 0, srcH = 0;
let dotShape      = 'circle';
let renderPending = false;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const dropZone          = document.getElementById('dropZone');
const fileInput         = document.getElementById('fileInput');
const originalCanvas    = document.getElementById('originalCanvas');
const halftoneCanvas    = document.getElementById('halftoneCanvas');
const processingOverlay = document.getElementById('processingOverlay');
const downloadPngBtn    = document.getElementById('downloadPng');
const downloadSvgBtn    = document.getElementById('downloadSvg');
const dropState         = document.getElementById('dropState');
const imageState        = document.getElementById('imageState');
const presetsBar        = document.getElementById('presetsBar');

const ctrl = {
  spacing:    document.getElementById('spacing'),
  maxSize:    document.getElementById('maxSize'),
  minSize:    document.getElementById('minSize'),
  contrast:   document.getElementById('contrast'),
  brightness: document.getElementById('brightness'),
  angle:      document.getElementById('angle'),
  dotColor:   document.getElementById('dotColor'),
  bgColor:    document.getElementById('bgColor'),
};

const lbl = {
  spacing:    document.getElementById('spacingVal'),
  maxSize:    document.getElementById('maxSizeVal'),
  minSize:    document.getElementById('minSizeVal'),
  contrast:   document.getElementById('contrastVal'),
  brightness: document.getElementById('brightnessVal'),
  angle:      document.getElementById('angleVal'),
  dotColor:   document.getElementById('dotColorVal'),
  bgColor:    document.getElementById('bgColorVal'),
};

// ── State transitions ─────────────────────────────────────────────────────────
function showImageState() {
  dropState.style.display = 'none';
  imageState.classList.add('show');
  presetsBar.classList.add('show');
}

function showDropState() {
  imageState.classList.remove('show');
  dropState.style.display = '';
  presetsBar.classList.remove('show');
  sourcePixels = null;
}

document.getElementById('changeImageBtn').addEventListener('click', showDropState);

// ── Helpers ───────────────────────────────────────────────────────────────────
function getParams() {
  return {
    spacing:    +ctrl.spacing.value,
    maxSize:    +ctrl.maxSize.value / 100,
    minSize:    +ctrl.minSize.value / 100,
    contrast:   +ctrl.contrast.value,
    brightness: +ctrl.brightness.value,
    angle:      +ctrl.angle.value * Math.PI / 180,
    dotColor:   ctrl.dotColor.value,
    bgColor:    ctrl.bgColor.value,
    shape:      dotShape,
  };
}

function updateLabels() {
  lbl.spacing.textContent    = ctrl.spacing.value    + 'px';
  lbl.maxSize.textContent    = ctrl.maxSize.value    + '%';
  lbl.minSize.textContent    = ctrl.minSize.value    + '%';
  lbl.contrast.textContent   = ctrl.contrast.value;
  lbl.brightness.textContent = ctrl.brightness.value;
  lbl.angle.textContent      = ctrl.angle.value      + '°';
  lbl.dotColor.textContent   = ctrl.dotColor.value;
  lbl.bgColor.textContent    = ctrl.bgColor.value;
}

// ── Image loading ─────────────────────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => prepareSource(img);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function prepareSource(img) {
  const scale = Math.min(1, MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
  srcW = Math.round(img.naturalWidth  * scale);
  srcH = Math.round(img.naturalHeight * scale);

  const offscreen = document.createElement('canvas');
  offscreen.width = srcW; offscreen.height = srcH;
  const octx = offscreen.getContext('2d');
  octx.drawImage(img, 0, 0, srcW, srcH);
  sourcePixels = octx.getImageData(0, 0, srcW, srcH);

  originalCanvas.width  = srcW;
  originalCanvas.height = srcH;
  originalCanvas.getContext('2d').drawImage(img, 0, 0, srcW, srcH);

  showImageState();
  scheduleRender();
}

// ── Pixel math ────────────────────────────────────────────────────────────────
function adjustChannel(v, contrast, brightness) {
  v += brightness * 2.55;
  if (contrast !== 0) {
    const f = (259 * (contrast + 255)) / (255 * (259 - contrast));
    v = f * (v - 128) + 128;
  }
  return v < 0 ? 0 : v > 255 ? 255 : v;
}

function sampleLuminance(x, y, contrast, brightness) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0) x = 0; else if (x >= srcW) x = srcW - 1;
  if (y < 0) y = 0; else if (y >= srcH) y = srcH - 1;
  const i = (y * srcW + x) * 4;
  const d = sourcePixels.data;
  return 0.2126 * adjustChannel(d[i],     contrast, brightness)
       + 0.7152 * adjustChannel(d[i + 1], contrast, brightness)
       + 0.0722 * adjustChannel(d[i + 2], contrast, brightness);
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function drawDot(ctx, cx, cy, r, shape) {
  if (r < 0.3) return;
  ctx.beginPath();
  if (shape === 'circle') {
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
  } else {
    ctx.rect(cx - r, cy - r, r * 2, r * 2);
  }
  ctx.fill();
}

function renderHalftone() {
  renderPending = false;
  if (!sourcePixels) return;

  const p    = getParams();
  const sp   = p.spacing;
  const maxR = sp * 0.5 * p.maxSize;
  const minR = sp * 0.5 * p.minSize;
  const cosA = Math.cos(p.angle);
  const sinA = Math.sin(p.angle);
  const W = srcW, H = srcH;
  const cx = W / 2, cy = H / 2;

  halftoneCanvas.width  = W;
  halftoneCanvas.height = H;
  const ctx = halftoneCanvas.getContext('2d');

  ctx.fillStyle = p.bgColor;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  ctx.fillStyle = p.dotColor;

  const diag  = Math.ceil(Math.sqrt(W * W + H * H));
  const steps = Math.ceil(diag / sp) + 1;

  for (let i = -steps; i <= steps; i++) {
    for (let j = -steps; j <= steps; j++) {
      const gx = j * sp, gy = i * sp;
      const sx = cx + gx * cosA - gy * sinA;
      const sy = cy + gx * sinA + gy * cosA;
      if (sx < -sp || sx > W + sp || sy < -sp || sy > H + sp) continue;
      const lum = sampleLuminance(sx, sy, p.contrast, p.brightness);
      const t   = 1 - lum / 255;
      drawDot(ctx, sx, sy, minR + t * (maxR - minR), p.shape);
    }
  }

  ctx.restore();
  processingOverlay.classList.remove('show');
}

function scheduleRender() {
  if (!sourcePixels || renderPending) return;
  renderPending = true;
  processingOverlay.classList.add('show');
  requestAnimationFrame(() => requestAnimationFrame(() => renderHalftone()));
}

// ── Export PNG ────────────────────────────────────────────────────────────────
downloadPngBtn.addEventListener('click', () => {
  const a = Object.assign(document.createElement('a'), {
    download: 'halftone-dots.png',
    href: halftoneCanvas.toDataURL('image/png'),
  });
  a.click();
});

// ── Export SVG ────────────────────────────────────────────────────────────────
downloadSvgBtn.addEventListener('click', exportSVG);

function exportSVG() {
  if (!sourcePixels) return;
  const p    = getParams();
  const sp   = p.spacing;
  const maxR = sp * 0.5 * p.maxSize;
  const minR = sp * 0.5 * p.minSize;
  const cosA = Math.cos(p.angle), sinA = Math.sin(p.angle);
  const W = srcW, H = srcH, cx = W / 2, cy = H / 2;
  const steps = Math.ceil(Math.sqrt(W * W + H * H) / sp) + 1;
  let shapes = '';

  for (let i = -steps; i <= steps; i++) {
    for (let j = -steps; j <= steps; j++) {
      const gx = j * sp, gy = i * sp;
      const sx = cx + gx * cosA - gy * sinA;
      const sy = cy + gx * sinA + gy * cosA;
      if (sx < -sp || sx > W + sp || sy < -sp || sy > H + sp) continue;
      const lum = sampleLuminance(sx, sy, p.contrast, p.brightness);
      const r   = minR + (1 - lum / 255) * (maxR - minR);
      if (r < 0.3) continue;
      const rx = sx.toFixed(2), ry = sy.toFixed(2), rv = r.toFixed(2);
      shapes += p.shape === 'circle'
        ? `<circle cx="${rx}" cy="${ry}" r="${rv}"/>`
        : `<rect x="${(sx-r).toFixed(2)}" y="${(sy-r).toFixed(2)}" width="${(r*2).toFixed(2)}" height="${(r*2).toFixed(2)}"/>`;
    }
  }

  const svg = [
    `<?xml version="1.0" encoding="UTF-8"?>`,
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`,
    `  <defs><clipPath id="b"><rect width="${W}" height="${H}"/></clipPath></defs>`,
    `  <rect width="${W}" height="${H}" fill="${p.bgColor}"/>`,
    `  <g fill="${p.dotColor}" clip-path="url(#b)">${shapes}</g>`,
    `</svg>`,
  ].join('\n');

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { download: 'halftone-dots.svg', href: url });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── Presets ───────────────────────────────────────────────────────────────────
function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  ctrl.spacing.value    = p.spacing;
  ctrl.maxSize.value    = p.maxSize;
  ctrl.minSize.value    = p.minSize;
  ctrl.contrast.value   = p.contrast;
  ctrl.brightness.value = p.brightness;
  ctrl.angle.value      = p.angle;
  ctrl.dotColor.value   = p.dotColor;
  ctrl.bgColor.value    = p.bgColor;
  updateLabels();
  scheduleRender();
}

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyPreset(btn.dataset.preset);
  });
});

// ── Shape toggle ──────────────────────────────────────────────────────────────
document.querySelectorAll('.shape-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    dotShape = btn.dataset.shape;
    scheduleRender();
  });
});

// ── Sliders & color pickers ───────────────────────────────────────────────────
Object.values(ctrl).forEach(input => {
  input.addEventListener('input', () => { updateLabels(); scheduleRender(); });
});

// ── Reset ─────────────────────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  ctrl.spacing.value    = DEFAULTS.spacing;
  ctrl.maxSize.value    = DEFAULTS.maxSize;
  ctrl.minSize.value    = DEFAULTS.minSize;
  ctrl.contrast.value   = DEFAULTS.contrast;
  ctrl.brightness.value = DEFAULTS.brightness;
  ctrl.angle.value      = DEFAULTS.angle;
  ctrl.dotColor.value   = DEFAULTS.dotColor;
  ctrl.bgColor.value    = DEFAULTS.bgColor;
  dotShape = DEFAULTS.shape;
  document.querySelectorAll('.shape-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  updateLabels();
  scheduleRender();
});

// ── Drag & drop ───────────────────────────────────────────────────────────────
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

// ── Init ──────────────────────────────────────────────────────────────────────
updateLabels();
</script>
</body>
</html>
