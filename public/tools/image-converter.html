<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Converter</title>
  <script>
    (function () {
      if (window.self !== window.top) document.documentElement.dataset.embed = '1';
      try {
        if (window.parent.document.documentElement.classList.contains('dark'))
          document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Regular.otf') format('opentype'); font-weight:400; }
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Medium.otf')  format('opentype'); font-weight:500; }
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Semibold.otf') format('opentype'); font-weight:600; }
    @font-face { font-family:'SF Pro Display'; src:url('../fonts/SF-Pro-Display-Bold.otf')    format('opentype'); font-weight:700; }

    :root {
      --bg:           #F2EDD9;
      --border:       rgba(0,0,0,0.08);
      --headline:     #1c1c1e;
      --body:         #6b6861;
      --social-bg:    rgba(0,0,0,0.05);
      --social-hover: rgba(0,0,0,0.10);
      --input-bg:     rgba(0,0,0,0.04);
      --input-border: rgba(0,0,0,0.08);
      --accent:       #cf0506;
      --scrollbar:    rgba(0,0,0,0.10);
      --slider-track: rgba(0,0,0,0.12);
    }
    .dark {
      --bg:           #080808;
      --border:       rgba(255,255,255,0.08);
      --headline:     #f3f0e5;
      --body:         #aba795;
      --social-bg:    rgba(255,255,255,0.05);
      --social-hover: rgba(255,255,255,0.10);
      --input-bg:     rgba(255,255,255,0.04);
      --input-border: rgba(255,255,255,0.08);
      --accent:       #cf0506;
      --scrollbar:    rgba(255,255,255,0.10);
      --slider-track: rgba(255,255,255,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--headline);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    [data-embed='1'] .page-header { display: none !important; }

    /* ── Header ── */
    .page-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-link { font-size:12px; font-weight:500; color:var(--body); text-decoration:none; transition:color .15s; }
    .back-link:hover { color:var(--accent); }
    .hdr-sep { width:1px; height:14px; background:var(--border); }
    .hdr-title { font-size:13px; font-weight:500; color:var(--headline); }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* ══════════════════════════════════════
       DROP STATE
    ══════════════════════════════════════ */
    #dropState {
      width: 100%; flex: 1;
      display: flex; align-items: stretch;
      padding: 120px;
      min-height: 0;
    }

    :root .drop-zone {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(0,0,0,0.18)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
    }
    .dark .drop-zone {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(255,255,255,0.12)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
    }
    .drop-zone {
      width: 100%; height: 100%;
      border: none; border-radius: 14px; position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; cursor: pointer;
      transition: background-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='14' ry='14' stroke='rgba(207,5,6,0.5)' stroke-width='1.5' stroke-dasharray='6 6' stroke-linecap='square'/%3e%3c/svg%3e");
      background-color: rgba(207,5,6,0.03);
    }
    .drop-icon { opacity: 0.35; color: var(--headline); }
    .drop-zone-label { font-size:12px; font-weight:500; color:var(--body); opacity:.55; }
    .drop-zone input { display:none; }

    /* ══════════════════════════════════════
       CONVERT STATE
    ══════════════════════════════════════ */
    #convertState {
      display: none;
      width: 100%; flex: 1;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      overflow-y: auto;
      min-height: 0;
    }
    #convertState.show { display: flex; }

    .convert-card {
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* File info bar */
    .file-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .file-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .file-name {
      font-size: 12px; font-weight: 500;
      color: var(--headline);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-meta { font-size: 10px; color: var(--body); opacity: 0.7; }

    .change-btn {
      height: 28px; padding: 0 12px;
      font-family: inherit; font-size: 11px; font-weight: 500;
      color: var(--body);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
      transition: color .15s, border-color .15s;
    }
    .change-btn:hover { color: var(--headline); border-color: var(--body); }

    /* Settings rows */
    .setting-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .setting-label {
      font-size: 10px; font-weight: 600;
      color: var(--body); opacity: 0.7;
      text-transform: uppercase; letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    /* Format toggle */
    .fmt-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .fmt-btn {
      height: 30px; padding: 0 14px;
      font-family: inherit; font-size: 11px; font-weight: 500;
      background: transparent; color: var(--body);
      border: none; cursor: pointer;
      transition: background .15s, color .15s;
    }
    .fmt-btn + .fmt-btn { border-left: 1px solid var(--border); }
    .fmt-btn.active { background: rgba(207,5,6,0.09); color: var(--accent); }

    /* Quality slider */
    .quality-right { display: flex; align-items: center; gap: 10px; }
    .quality-val { font-size: 11px; font-weight: 600; color: var(--accent); width: 34px; text-align: right; flex-shrink: 0; }
    input[type="range"] {
      -webkit-appearance: none;
      width: 130px; height: 3px;
      border-radius: 2px;
      background: var(--slider-track);
      outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 0 2px var(--bg);
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer; border: none;
    }

    /* Resize */
    .resize-right { display: flex; align-items: center; gap: 6px; }
    .dim-input {
      width: 64px; height: 30px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--headline);
      font-family: inherit; font-size: 11px; font-weight: 500;
      padding: 0 8px; outline: none; text-align: center;
      transition: border-color .15s;
    }
    .dim-input:focus { border-color: rgba(207,5,6,0.35); }
    .dim-sep { font-size: 11px; color: var(--body); opacity: 0.5; }
    .lock-btn {
      height: 30px; width: 30px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent; color: var(--body);
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .lock-btn.locked { border-color: rgba(207,5,6,0.4); color: var(--accent); }

    /* Download button */
    .download-wrap {
      padding: 14px 16px;
    }
    .download-btn {
      width: 100%; height: 38px;
      background: var(--accent);
      border: none; border-radius: 9px;
      color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .download-btn:hover { opacity: 0.88; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
  </style>
</head>
<body>

<!-- Theme sync -->
<script>
(function () {
  try {
    const ph = window.parent.document.documentElement;
    const sync = () => document.documentElement.classList.toggle('dark', ph.classList.contains('dark'));
    sync();
    new MutationObserver(sync).observe(ph, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();
</script>

<!-- ════ HEADER ════ -->
<header class="page-header">
  <a href="../index.html" class="back-link">← Back</a>
  <div class="hdr-sep"></div>
  <span class="hdr-title">Image Converter</span>
</header>

<!-- ════ MAIN ════ -->
<div class="main">

  <!-- ── Drop state ── -->
  <div id="dropState">
    <label id="dropZone" class="drop-zone">
      <svg class="drop-icon" width="36" height="36" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M25.1363 14.3633C24.8188 14.3633 24.5144 14.4895 24.2899 14.7139C24.0654 14.9384 23.9393 15.2429 23.9393 15.5603V20.6031C23.9384 21.4876 23.5866 22.3355 22.9612 22.9609C22.3358 23.5863 21.4878 23.9381 20.6034 23.9391H5.72988C4.84542 23.9381 3.99746 23.5863 3.37206 22.9609C2.74665 22.3355 2.39488 21.4876 2.39393 20.6031V15.5603C2.39393 15.2429 2.26782 14.9384 2.04335 14.7139C1.81887 14.4895 1.51442 14.3633 1.19697 14.3633C0.879511 14.3633 0.575058 14.4895 0.350583 14.7139C0.126109 14.9384 0 15.2429 0 15.5603V20.6031C0.00158429 22.1223 0.605775 23.5788 1.67999 24.653C2.75421 25.7272 4.21071 26.3314 5.72988 26.333H20.6034C22.1225 26.3314 23.579 25.7272 24.6533 24.653C25.7275 23.5788 26.3317 22.1223 26.3333 20.6031V15.5603C26.3333 15.2429 26.2071 14.9384 25.9827 14.7139C25.7582 14.4895 25.4537 14.3633 25.1363 14.3633Z" fill="currentColor"/>
        <path d="M6.83125 9.22476L11.9698 4.08619V19.1512C11.9698 19.4687 12.0959 19.7731 12.3204 19.9976C12.5449 20.2221 12.8493 20.3482 13.1668 20.3482C13.4842 20.3482 13.7887 20.2221 14.0132 19.9976C14.2376 19.7731 14.3638 19.4687 14.3638 19.1512V4.08619L19.5023 9.22476C19.7281 9.4428 20.0304 9.56344 20.3443 9.56072C20.6581 9.55799 20.9583 9.43211 21.1803 9.21018C21.4022 8.98825 21.5281 8.68804 21.5308 8.3742C21.5335 8.06036 21.4129 7.758 21.1948 7.53225L14.013 0.350455C13.7886 0.126059 13.4842 0 13.1668 0C12.8494 0 12.545 0.126059 12.3205 0.350455L5.13874 7.53225C4.9207 7.758 4.80005 8.06036 4.80278 8.3742C4.80551 8.68804 4.93139 8.98825 5.15332 9.21018C5.37525 9.43211 5.67546 9.55799 5.9893 9.56072C6.30314 9.56344 6.6055 9.4428 6.83125 9.22476Z" fill="currentColor"/>
      </svg>
      <p class="drop-zone-label">Click to select or drop an image</p>
      <input type="file" id="fileInput" accept="image/*" />
    </label>
  </div>

  <!-- ── Convert state ── -->
  <div id="convertState">
    <div class="convert-card">

      <!-- File info -->
      <div class="file-bar">
        <div class="file-info">
          <span class="file-name" id="fileName">image.png</span>
          <span class="file-meta" id="fileMeta">—</span>
        </div>
        <button class="change-btn" id="changeBtn">⤴ Change</button>
      </div>

      <!-- Format -->
      <div class="setting-row">
        <span class="setting-label">Format</span>
        <div class="fmt-toggle">
          <button class="fmt-btn active" data-fmt="image/png"  data-ext="png">PNG</button>
          <button class="fmt-btn"        data-fmt="image/jpeg" data-ext="jpg">JPG</button>
          <button class="fmt-btn"        data-fmt="image/webp" data-ext="webp">WebP</button>
        </div>
      </div>

      <!-- Quality -->
      <div class="setting-row" id="qualityRow">
        <span class="setting-label">Quality</span>
        <div class="quality-right">
          <input type="range" id="qualitySlider" min="10" max="100" value="90" />
          <span class="quality-val" id="qualityVal">90%</span>
        </div>
      </div>

      <!-- Resize -->
      <div class="setting-row">
        <span class="setting-label">Resize</span>
        <div class="resize-right">
          <input class="dim-input" id="outWidth"  type="number" min="1" max="8000" placeholder="W" />
          <span class="dim-sep">×</span>
          <input class="dim-input" id="outHeight" type="number" min="1" max="8000" placeholder="H" />
          <button class="lock-btn locked" id="lockBtn">⛓</button>
        </div>
      </div>

      <!-- Download -->
      <div class="download-wrap">
        <button class="download-btn" id="downloadBtn">↓ Download</button>
      </div>

    </div>
  </div>

</div><!-- /main -->

<canvas id="offscreen" style="display:none;"></canvas>


<!-- ════ SCRIPT ════ -->
<script>
'use strict';

let sourceImg    = null;
let origW = 0, origH = 0;
let outputFmt    = 'image/png';
let outputExt    = 'png';
let quality      = 0.90;
let aspectLocked = true;
let baseName     = 'image';

const dropZone    = document.getElementById('dropZone');
const fileInput   = document.getElementById('fileInput');
const dropState   = document.getElementById('dropState');
const convertState = document.getElementById('convertState');
const qualityRow  = document.getElementById('qualityRow');
const offscreen   = document.getElementById('offscreen');


// ── Load file ──────────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  baseName = file.name.replace(/\.[^.]+$/, '');

  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    sourceImg = img;
    origW = img.naturalWidth;
    origH = img.naturalHeight;
    URL.revokeObjectURL(url);

    document.getElementById('outWidth').value  = origW;
    document.getElementById('outHeight').value = origH;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileMeta').textContent =
      origW + ' × ' + origH + ' px · ' + formatBytes(file.size);

    dropState.style.display = 'none';
    convertState.classList.add('show');
  };
  img.src = url;
}

function reset() {
  sourceImg = null;
  dropState.style.display = '';
  convertState.classList.remove('show');
  fileInput.value = '';
}


// ── Drag & drop ────────────────────────────────────────────────
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
document.getElementById('changeBtn').addEventListener('click', reset);


// ── Format ─────────────────────────────────────────────────────
document.querySelectorAll('.fmt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    outputFmt = btn.dataset.fmt;
    outputExt = btn.dataset.ext;
    const isPng = outputFmt === 'image/png';
    qualityRow.style.opacity       = isPng ? '0.35' : '1';
    qualityRow.style.pointerEvents = isPng ? 'none'  : 'auto';
  });
});


// ── Quality ────────────────────────────────────────────────────
document.getElementById('qualitySlider').addEventListener('input', function () {
  quality = this.value / 100;
  document.getElementById('qualityVal').textContent = this.value + '%';
});


// ── Resize / aspect lock ────────────────────────────────────────
document.getElementById('lockBtn').addEventListener('click', function () {
  aspectLocked = !aspectLocked;
  this.classList.toggle('locked', aspectLocked);
  this.textContent = aspectLocked ? '⛓' : '✂';
});
document.getElementById('outWidth').addEventListener('input', function () {
  if (aspectLocked && origW && origH)
    document.getElementById('outHeight').value = Math.round(+this.value * origH / origW) || '';
});
document.getElementById('outHeight').addEventListener('input', function () {
  if (aspectLocked && origW && origH)
    document.getElementById('outWidth').value = Math.round(+this.value * origW / origH) || '';
});


// ── Download ───────────────────────────────────────────────────
document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!sourceImg) return;

  const tw = parseInt(document.getElementById('outWidth').value)  || origW;
  const th = parseInt(document.getElementById('outHeight').value) || origH;

  offscreen.width  = tw;
  offscreen.height = th;
  const ctx = offscreen.getContext('2d');

  if (outputFmt !== 'image/png') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, tw, th);
  } else {
    ctx.clearRect(0, 0, tw, th);
  }

  ctx.drawImage(sourceImg, 0, 0, tw, th);

  const q = outputFmt === 'image/png' ? undefined : quality;
  const a = Object.assign(document.createElement('a'), {
    href: offscreen.toDataURL(outputFmt, q),
    download: baseName + '-converted.' + outputExt,
  });
  a.click();
});


// ── Helpers ────────────────────────────────────────────────────
function formatBytes(b) {
  if (b < 1024)    return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(2) + ' MB';
}
</script>
</body>
</html>
